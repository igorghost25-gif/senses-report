/* ---------- login ---------- */
function attemptLogin(){
  if(!state.loginName){ state.loginError = 'Select your name first.'; render(); return; }
  const existingPin = state.staffPins[state.loginName];
  if(!existingPin){
    // First time this name has logged in (or a manager reset it) — the
    // entered value creates their PIN instead of checking it.
    if(!/^\d{4}$/.test(state.loginPassword)){ state.loginError = 'Create a 4-digit PIN (numbers only).'; render(); return; }
    createStaffPin(state.loginName, state.loginPassword);
    return;
  }
  if(state.loginPassword !== existingPin){ state.loginError = 'Incorrect PIN.'; state.loginPassword = ''; render(); return; }
  state.loggedIn = true;
  state.isAdmin = false;
  state.form.name = state.loginName;
  state.loginPassword = '';
  state.loginError = null;
  saveSession();
  render();
}
function saveSession(){
  // Only ever save a therapist identity. Admin sessions must never persist.
  if(state.isAdmin) return;
  try { localStorage.setItem('senses_session', JSON.stringify({ name: state.form.name })); } catch(e){}
}
function restoreSession(){
  try {
    const raw = localStorage.getItem('senses_session');
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(s && s.name){
      state.loggedIn = true;
      state.isAdmin = false; // never restore admin status, even if an old stale session had it
      state.form.name = s.name;
      return true;
    }
  } catch(e){}
  return false;
}
function toggleAdminLogin(){
  state.showAdminLogin = !state.showAdminLogin;
  state.adminPinInput = ''; state.adminPinError = false;
  render();
}
function attemptAdminLogin(){
  if(state.adminPinInput === MANAGER_PIN){
    state.loggedIn = true;
    state.isAdmin = true;
    state.tab = 'manager';
    state.form = emptyForm(); // admin has no therapist identity
    state.adminPinInput = ''; state.adminPinError = false;
    // Deliberately NOT calling saveSession() — admin access must require the PIN every time.
  } else {
    state.adminPinError = true; state.adminPinInput = '';
  }
  render();
}
function logout(){
  state.loggedIn = false; state.isAdmin = false; state.showAdminLogin = false;
  state.loginName = ''; state.loginPassword = ''; state.loginError = null;
  state.adminPinInput = ''; state.adminPinError = false;
  state.form = emptyForm(); // fully clear identity so nothing leaks into the next session
  state.tab = 'home';
  try { localStorage.removeItem('senses_session'); } catch(e){}
  render();
}
function currentUserLabel(){ return state.isAdmin ? 'Admin' : (state.form.name || 'Unknown'); }

// Shared by every export/print button that depends on a CDN-loaded library
// (XLSX, html2canvas, jsPDF). On a ship, wifi drops or is too slow for those
// scripts to have loaded — without this, clicking the button did nothing
// visible at all. Injected next to the button itself (not via state+render)
// so it survives without disturbing whatever's currently on screen.
function showExportError(btn, text){
  if(!btn || !btn.parentElement) return;
  let msg = btn.parentElement.querySelector('.export-error-msg');
  if(!msg){
    msg = document.createElement('div');
    msg.className = 'export-error-msg error-msg';
    msg.setAttribute('role','alert');
    msg.style.cssText = 'margin-top:8px; width:100%;';
    btn.parentElement.appendChild(msg);
  }
  msg.textContent = text;
}
function clearExportError(btn){
  const msg = btn && btn.parentElement && btn.parentElement.querySelector('.export-error-msg');
  if(msg) msg.remove();
}

function exportExcelByDay(btnId){
  const btn = document.getElementById(btnId || 'export-btn');
  clearExportError(btn);
  if(typeof XLSX === 'undefined'){
    showExportError(btn, "Couldn't build the Excel file — the export library didn't load. Check your connection and try again.");
    return;
  }
  try {
    // One sheet per cruise day, every roster therapist listed as a row (even
    // before they've submitted) so the workbook reads like a pre-built template
    // that just gets filled in as reports come in — same idea as the daily EOD
    // workbook, instead of one flat growing list of raw submissions.
    const headers = ['Name','Rebook #','Rebook $','Add On #','Add On $','XP #','XP $','Retail $','Guests','Total $','Pkgs','Touch','Submitted At'];
    const wb = XLSX.utils.book_new();

    // Cruise to Date first, so it's what's showing when the file opens — same
    // ranked-by-AIR leaderboard as the in-app "Cruise to Date" tab.
    const ctd = computeCruiseToDate();
    const ctdHeaders = ['#','Name','Role','Rebook #','Rebook $','Add On #','Add On $','XP #','XP $','Retail $','Guests','AIR CTD'];
    const ctdRanks = ctd.rows.map((r,i) => (i>0 && r.air === ctd.rows[i-1].air) ? null : i+1);
    for(let i=1;i<ctdRanks.length;i++){ if(ctdRanks[i]===null) ctdRanks[i]=ctdRanks[i-1]; }
    const ctdRows = ctd.rows.map((r,i) => [ctdRanks[i], r.name, r.position, r.rebookNum, r.rebookAmt, r.addonNum, r.addonAmt, r.xpNum, r.xpAmt, r.retailAmt, r.guests, Math.round(r.air*100)/100]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([ctdHeaders, ...ctdRows]), 'Cruise to Date');

    for(let day = 1; day <= state.voyageDays; day++){
      const rows = state.roster.map(n => {
        const e = state.entries.find(x => x.cruiseDay === day && x.name === n);
        if(!e) return [n, '', '', '', '', '', '', '', '', '', '', '', ''];
        return [n, e.rebookNum, e.rebookAmt, e.addonNum, e.addonAmt, e.xpNum, e.xpAmt, e.retailAmt, e.guestsToday, entryTotal(e), e.packagesNum, e.touchPoints, e.submittedAt];
      });
      const sheet = XLSX.utils.aoa_to_sheet([headers, ...rows]);
      XLSX.utils.book_append_sheet(wb, sheet, 'Day ' + day);
    }
    XLSX.writeFile(wb, 'senses-report-by-day-' + new Date().toISOString().slice(0,10) + '.xlsx');
  } catch(err){
    console.error(err);
    showExportError(btn, "Couldn't build the Excel file. Check your connection and try again.");
  }
}

/* ---------- render root ---------- */
function render(){
  const existingModal = document.querySelector('.lesson-modal-backdrop');
  if(existingModal) existingModal.remove();
  const existingShipLog = document.querySelector('.shiplog-backdrop');
  if(existingShipLog) existingShipLog.remove();
  const existingCelebrate = document.querySelector('.celebrate-backdrop');
  if(existingCelebrate) existingCelebrate.remove();
  const root = document.getElementById('root');
  root.innerHTML = '';
  root.classList.toggle('admin-mode', !!(state.isAdmin && state.loggedIn && !state.loading && !state.loadError));

  if(!state.loading && !state.loadError && !state.loggedIn){
    root.appendChild(renderMasthead());
    const content = document.createElement('main'); content.className = 'content'; content.id = 'main-content';
    content.appendChild(renderLoginGate());
    root.appendChild(content);
    return;
  }

  root.appendChild(renderMasthead());
  const content = document.createElement('main'); content.className = 'content'; content.id = 'main-content';
  if(state.loading){ content.appendChild(renderSkeleton()); }
  else if(state.loadError){ const e = document.createElement('div'); e.className='error-msg'; e.setAttribute('role','alert'); e.textContent = state.loadError; content.appendChild(e); }
  else if(state.isAdmin){
    // Admin/manager identity never renders therapist-facing screens (submit, leaderboard,
    // history, hub, targets) — those require acting as a therapist, which admin must not do.
    content.appendChild(renderManagerTab());
  }
  else {
    // Newly-achieved targets get a one-time unlock celebration the next time this
    // therapist's screen renders — covers both a live submission crossing the goal
    // and a target that only became achievable once admin uploaded a sales recap.
    checkTargetCelebrations(state.form.name);
    const wipLabels = { submit:'Submit', leaderboard:'Leaderboard', history:'History', hub:'Hub', targets:'Targets' };
    if(['submit','leaderboard','history','hub','targets'].includes(state.tab) && state.wipSections[state.tab]){
      content.appendChild(renderWipPlaceholder(wipLabels[state.tab]));
    }
    else if(state.tab === 'submit') content.appendChild(renderSubmitTab());
    else if(state.tab === 'leaderboard') content.appendChild(renderLeaderboardTab());
    else if(state.tab === 'history') content.appendChild(renderHistoryTab());
    else if(state.tab === 'hub') content.appendChild(renderHubTab());
    else if(state.tab === 'targets') content.appendChild(renderTargetsTab());
    else content.appendChild(renderTherapistHome());
  }
  root.appendChild(content);
  if(!state.isAdmin) root.appendChild(renderBottomNav());
  if(state.openLessonModal){
    const modal = renderLessonModal();
    if(modal) document.body.appendChild(modal);
  }
  if(state.shipLogName){
    const shipModal = renderShipLogModal();
    if(shipModal) document.body.appendChild(shipModal);
  }
  if(state.targetCelebration && !state.isAdmin){
    document.body.appendChild(renderTargetCelebrationModal());
  }
}

function renderLoginGate(){

        <input type="text" id="login-name-search" class="name-search" autocomplete="off" placeholder="Tap to see everyone, or type your name…" value="${escapeHtml(state.loginName)}">
        <button type="button" class="name-search-clear ${state.loginName?'show':''}" id="login-name-clear" aria-label="Clear selected name">&times;</button>
      </div>
      <div class="name-dropdown" id="login-name-dropdown" role="listbox"></div>
    </div>
    ${state.loginName ? `
    <div class="field" style="text-align:left;">
      <label for="login-password">${isNewPin ? 'Create a 4-digit PIN' : 'Smart PIN'}</label>
      <input type="tel" inputmode="numeric" maxlength="4" id="login-password" placeholder="${isNewPin ? '••••' : 'Numbers only'}" value="${escapeHtml(state.loginPassword)}">
    </div>
    ${isNewPin ? `<div style="font-size:10.5px; color:var(--ink-soft); margin-bottom:14px;">First time logging in — pick any 4 digits. You'll use this same PIN every time after today.</div>` : ''}
    ` : ''}
    ${state.loginError ? `<div class="error-msg">${escapeHtml(state.loginError)}</div>` : ''}
    <button class="pin-submit" id="login-btn" ${state.loginSaving?'disabled':''}>${state.loginSaving ? 'Saving…' : (isNewPin ? 'Create PIN & continue' : 'Continue')}</button>
    <div style="margin-top:16px;">
      <button class="admin-login-link" id="admin-toggle">${state.showAdminLogin ? 'Hide admin login' : 'Admin login'}</button>

        ${state.adminPinError ? `<div class="error-msg" style="max-width:220px;margin:10px auto 0;">Incorrect PIN.</div>` : ''}

      </div>
    ` : ''}
  `;
  frag.appendChild(panel);
  setTimeout(() => {

      pw.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); attemptLogin(); } };
    }
    const btn = document.getElementById('login-btn'); if(btn) btn.onclick = attemptLogin;
    const adminToggle = document.getElementById('admin-toggle'); if(adminToggle) adminToggle.onclick = toggleAdminLogin;
    const adminPin = document.getElementById('admin-pin-input');
    if(adminPin){
      adminPin.focus();
      adminPin.oninput = e => { state.adminPinInput = e.target.value.replace(/\D/g,'').slice(0,4); state.adminPinError=false; };
      adminPin.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); attemptAdminLogin(); } };
    }
    const adminBtn = document.getElementById('admin-pin-submit'); if(adminBtn) adminBtn.onclick = attemptAdminLogin;
  }, 0);
  return frag;
}

/* ---------- therapist home ---------- */
function renderTherapistHome(){
  const frag = document.createDocumentFragment();
  const myName = state.form.name;

  if(!myName){
    const p = document.createElement('div'); p.className='panel';
    p.innerHTML = `<div class="empty-state">Select your name on the Submit tab first — your home screen shows up here once you have.</div>`;
    frag.appendChild(p); return frag;
  }

  const allDays = state.entries.map(e => e.cruiseDay);
  const today = allDays.length > 0 ? Math.max(...allDays) : 1;
  const mine = state.entries.filter(e => e.name === myName);

  const todaysMine = mine.filter(e => e.cruiseDay === today);
  const revenueToday = todaysMine.reduce((s,e) => s + entryTotal(e), 0);
  const yestMine = mine.filter(e => e.cruiseDay === today - 1);
  const revenueYest = yestMine.reduce((s,e) => s + entryTotal(e), 0);
  const delta = revenueYest > 0 ? Math.round(((revenueToday - revenueYest) / revenueYest) * 100) : null;

  const daysSubmitted = new Set(mine.map(e => e.cruiseDay)).size;
  const submittedToday = todaysMine.length > 0;
  const pct = state.voyageDays > 0 ? Math.round((daysSubmitted / state.voyageDays) * 100) : 0;

  const totalRetail = computeStaffCumulative(myName, 'retailSales');
  const airsRankInfo = computeAirsRank(myName);
  const airsRankFill = airsRankInfo.rank && airsRankInfo.of > 0 ? Math.round(((airsRankInfo.of - airsRankInfo.rank + 1) / airsRankInfo.of) * 100) : 0;

  let attention = null;
  if(state.targets.length > 0 && state.voyageDays > 0){
    const pace = Math.min(100, (today / state.voyageDays) * 100);
    state.targets.forEach(t => {
      const { pct: tpct } = computeTargetProgress(t, { name: myName, includeDraft:false });
      const behind = Math.round(pace - tpct);
      if(behind > 10 && (!attention || behind > attention.behind)) attention = { name: t.name, behind };
    });
  }
  const daysLeft = Math.max(0, state.voyageDays - today);

  // pick one target to headline on the home screen: whichever is closest to being earned
  // (most encouraging), or the first one if everything's still wide open
  let heroTarget = null;
  if(state.targets.length > 0){
    const withProgress = state.targets.map(t => ({ t, ...computeTargetProgress(t, { name: myName, includeDraft:false }) }));
    const unachieved = withProgress.filter(x => !x.achieved).sort((a,b) => b.pct - a.pct);
    heroTarget = unachieved.length > 0 ? unachieved[0] : withProgress[0];
  }

  const head = document.createElement('div'); head.className='head-row';
  head.innerHTML = `<div class="head-left"><div class="mh-avatar">${initials(myName)}</div><div><div class="greet-title">Hey! ${escapeHtml(myName.split(' ')[0])} &#128075;</div><div class="greet-sub">Senses Report &middot; Day ${today} of ${state.voyageDays}</div></div></div>`;
  frag.appendChild(head);

  const stat = document.createElement('div'); stat.className='stat-card';
  stat.innerHTML = `
    <div class="stat-label">Total revenue today</div>
    <div class="stat-val">${fmtMoney(revenueToday)}</div>
    ${delta !== null ? `<div class="stat-delta" style="${delta<0?'color:var(--coral);background:rgba(var(--coral-rgb),0.12);':''}">${delta>=0?'&#9650;':'&#9660;'} ${Math.abs(delta)}% from Day ${today-1}</div>` : ''}
  `;
  frag.appendChild(stat);

  const sub = document.createElement('div'); sub.className='sub-card'; sub.style.cursor='pointer';
  sub.innerHTML = `
    <div class="sub-top"><div class="sub-label">Your submissions</div><div class="sub-pct" style="${submittedToday?'':'color:var(--gold);'}">${submittedToday?'&#10003; Submitted':'Not yet'}</div></div>
    <div class="sub-val">${daysSubmitted}/${state.voyageDays} <span style="font-size:12px;color:var(--ink-faint);font-weight:700;">days</span></div>
    <div class="sub-cap">Day ${today} of ${state.voyageDays}${submittedToday?'':' &middot; tap to submit today'}</div>
    <div class="mh-track"><div class="mh-fill" data-w="${pct}" style="width:0%;"></div></div>
  `;
  sub.onclick = () => setTab('submit');
  frag.appendChild(sub);

  const two = document.createElement('div'); two.className='two-col';
  two.innerHTML = `
    <div class="mini-card"><div class="mini-label">Total Retail</div><div class="mini-sub">This voyage</div><div class="mini-val">${fmtMoney(totalRetail)}</div></div>
    <div class="mini-card"><div class="mini-label">Board Position</div><div class="mini-sub">AIR &middot; This voyage</div><div class="mini-val">${airsRankInfo.rank ? '#'+airsRankInfo.rank+(airsRankInfo.of>1?' of '+airsRankInfo.of:'') : '—'}</div><div class="mini-track"><div class="mini-fill" data-w="${airsRankFill}" style="width:0%; background:linear-gradient(90deg,var(--gold),#F5D98A); box-shadow:0 0 10px rgba(var(--gold-rgb),0.5);"></div></div></div>
    ${heroTarget ? `
    <div class="mini-card" id="home-target-card" style="cursor:pointer;">
      <div class="target-head" style="margin-bottom:0;">
        <div class="mini-label" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">&#127919; ${escapeHtml(heroTarget.t.name)}</div>
        <div class="target-reward ${heroTarget.achieved?'earned':''}" style="font-size:8.5px;padding:2px 7px;flex-shrink:0;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${heroTarget.achieved?'&#127881; Earned':'&#127873; '+escapeHtml(heroTarget.t.reward || 'Reward')}</div>
      </div>
      <div class="mini-val">${Math.round(heroTarget.pct)}%</div>
      <div class="target-track" style="margin-top:9px;"><div class="target-fill ${heroTarget.achieved?'done':''}" data-w="${heroTarget.pct}" style="width:0%;"></div></div>
      <div class="mini-sub" style="margin-top:7px;">${fmtTargetValue(heroTarget.value,heroTarget.t.metric)} / ${fmtTargetValue(heroTarget.t.value,heroTarget.t.metric)} ${escapeHtml(targetMetricLabel(heroTarget.t.metric))}</div>
    </div>` : ''}
  `;
  frag.appendChild(two);
  if(heroTarget){ const htc = two.querySelector('#home-target-card'); if(htc) htc.onclick = () => setTab('targets'); }

  if(attention){
    const attn = document.createElement('div'); attn.className='attn-card';
    attn.innerHTML = `<div class="attn-title">&#9888; Needs attention</div><div class="attn-text">"${escapeHtml(attention.name)}" target is ${attention.behind}% behind pace${daysLeft>0?` &mdash; ${daysLeft} day${daysLeft===1?'':'s'} left`:''}.</div>`;
    frag.appendChild(attn);
  }

  const cta = document.createElement('button'); cta.className='submit-btn'; cta.style.marginTop='4px';
  cta.textContent = submittedToday ? 'Submit another report' : "Submit today's report";
  cta.onclick = () => setTab('submit');
  frag.appendChild(cta);

  setTimeout(animateProgressBars, 0);
  return frag;
}

/* ---------- submit tab ---------- */
function renderSubmitTab(){
  const frag = document.createDocumentFragment();
  if(state.roster.length === 0){
    const w = document.createElement('div'); w.className='error-msg';
    w.textContent = 'No team roster yet. Go to the Manager tab to add names before staff can submit.';
    frag.appendChild(w); return frag;
  }
  if(state.submitConfirm) return renderConfirmScreen();
  if(state.submissionsClosed){
    const panel = document.createElement('div'); panel.className = 'panel';
    panel.innerHTML = `
      <div class="section" style="margin-top:0;">Submissions closed</div>
      <div class="empty-state" style="text-align:left;">${escapeHtml(state.closedMessage || DEFAULT_CLOSED_MESSAGE)}</div>
    `;
    frag.appendChild(panel);
    return frag;
  }

  const f = state.form;
  // The name is fixed to whoever authenticated on the login screen — this
  // form used to let anyone repick a name from the roster here with no PIN
  // check at all, which silently defeated the whole point of per-person PINs
  // (anyone at the tile could submit as someone else). Locked to state.loginName.
  f.name = state.loginName;
  if(!f.cruiseDay){
    const auto = computeCurrentCruiseDay();
    if(auto) f.cruiseDay = String(auto);
  }
  const panel = document.createElement('div'); panel.className = 'panel';
  const total = num(f.rebookAmt)+num(f.addonAmt)+num(f.xpAmt)+num(f.retailAmt);
  const guests = num(f.guestsToday);
  const airs = guests > 0 ? total / guests : 0;
  const submittedDays = new Set(state.entries.filter(e => e.name === f.name).map(e => e.cruiseDay));
  const selectedDayNum = f.cruiseDay ? num(f.cruiseDay) : null;
  // Days before today's cruise day (when the cruise start date is set, so
  // "today" is actually known) that never got a report are locked too — no
  // backdating a missed day from the staff side. Only meaningful once a
  // cruise start date is configured; without one there's no way to know
  // which day number "today" is, so nothing is treated as missed.
  const todayCruiseDay = computeCurrentCruiseDay();
  const missedDays = new Set(
    todayCruiseDay
      ? Array.from({length: state.voyageDays}, (_,i) => i+1).filter(d => d < todayCruiseDay && !submittedDays.has(d))
      : []
  );
  // Once a report is in for a given name+day, that day is locked on the staff
  // side — no silent resubmits that either get ignored (day view/export only
  // show the first entry) or double-counted (Cruise to Date sums every entry).
  // If a number needs correcting, a manager does it from Reports > Day.
  const locked = !!(f.name && selectedDayNum && submittedDays.has(selectedDayNum));
  const missedSelected = !!(selectedDayNum && missedDays.has(selectedDayNum));

  panel.innerHTML = `
    ${state.submitError ? `<div class="error-msg" role="alert">${escapeHtml(state.submitError)}</div>` : ''}
    <div class="field"><label>Your name</label>
      <div class="locked-name-row"><span class="locked-name-val">${escapeHtml(f.name)}</span><button type="button" class="locked-name-switch" id="not-you-btn">Not you?</button></div>
    </div>
    <div class="field"><label for="day-blocks">Day of Cruise</label>
      <div class="day-blocks" id="day-blocks" role="group" aria-label="Day of cruise">
        ${Array.from({length: state.voyageDays}, (_,i) => i+1).map(d => {
          const isSubmitted = submittedDays.has(d);
          const isMissed = missedDays.has(d);
          const label = isSubmitted ? ' — already submitted, locked' : (isMissed ? ' — missed, can no longer submit' : '');
          return `<button type="button" class="day-block ${String(d)===String(f.cruiseDay)?'active':''} ${isSubmitted?'submitted':''} ${isMissed?'missed':''}" data-day="${d}" ${(isSubmitted||isMissed)?'disabled':''} aria-label="Day ${d}${label}">${d}</button>`;
        }).join('')}
      </div>
      ${submittedDays.size > 0 || missedDays.size > 0 ? `<div class="day-legend">
        ${submittedDays.size > 0 ? `<span><span class="day-legend-dot"></span> Submitted</span>` : ''}
        ${missedDays.size > 0 ? `<span><span class="day-legend-dot missed"></span> Missed</span>` : ''}
      </div>` : ''}
    </div>
    ${locked ? `
    <div class="section">Already submitted</div>
    <div class="empty-state" style="text-align:left;">You already submitted Day ${selectedDayNum} for ${escapeHtml(f.name)}. If a number needs to change, ask your manager — they can edit or remove it from the Reports tab.</div>
    ` : missedSelected ? `
    <div class="section">Day missed</div>
    <div class="empty-state" style="text-align:left;">Day ${selectedDayNum} has passed without a report for ${escapeHtml(f.name)} and can't be submitted from here anymore. Ask your manager if it needs to be added — they can enter it manually from the Reports tab.</div>
    ` : `
    <div class="section">Guest activity</div>
    <div class="tile-grid">
      ${tileHTML('guestsToday','Guests','<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/>')}
      ${tileHTML('packagesNum','Packages','<rect x="4" y="7" width="16" height="13" rx="1.5"/><path d="M4 11h16M9 7V5a3 3 0 0 1 6 0v2"/>')}
      ${tileHTML('touchPoints','Touch Points','<path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h11"/>')}
    </div>

    <div class="section">Rebooking</div>
    <div class="tile-grid">
      ${tileHTML('rebookNum','Count','<path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/>')}
      ${tileHTML('rebookAmt','Amount','<circle cx="12" cy="12" r="8.5"/><path d="M12 7v10M9.5 9.5h3.7a1.8 1.8 0 0 1 0 3.6h-2.4a1.8 1.8 0 0 0 0 3.6h4"/>', true)}
    </div>

    <div class="section">Add on</div>
    <div class="tile-grid">
      ${tileHTML('addonNum','Count','<path d="M12 5v14M5 12h14"/>')}
      ${tileHTML('addonAmt','Amount','<circle cx="12" cy="12" r="8.5"/><path d="M12 7v10M9.5 9.5h3.7a1.8 1.8 0 0 1 0 3.6h-2.4a1.8 1.8 0 0 0 0 3.6h4"/>', true)}
    </div>

    <div class="section">Cross promotion (XP)</div>
    <div class="tile-grid">
      ${tileHTML('xpNum','Count','<circle cx="12" cy="8" r="6"/><path d="M12 14v7M9 21h6"/>')}
      ${tileHTML('xpAmt','Amount','<circle cx="12" cy="12" r="8.5"/><path d="M12 7v10M9.5 9.5h3.7a1.8 1.8 0 0 1 0 3.6h-2.4a1.8 1.8 0 0 0 0 3.6h4"/>', true)}
    </div>

    <div class="section">Retail</div>
    <div class="tile-grid">
      ${tileHTML('retailAmt','Amount','<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>', true)}
    </div>

    <div class="submit-fab"><button class="submit-btn" id="submit-btn" ${state.submitting?'disabled':''}>${state.submitting?'Logging…':'Submit report — AIR '+fmtMoney(airs)}</button></div>
    `}
  `;
  frag.appendChild(panel);

  setTimeout(() => {
    const ids = ['guestsToday','packagesNum','touchPoints','rebookNum','rebookAmt','addonNum','addonAmt','xpNum','xpAmt','retailAmt'];
    ids.forEach(id => {
      const el = document.getElementById('f-'+id);
      if(!el) return;
      const handler = ev => {
        state.form[id] = ev.target.value;
        if(['rebookAmt','addonAmt','xpAmt','retailAmt','guestsToday'].includes(id)){
          const t = num(state.form.rebookAmt)+num(state.form.addonAmt)+num(state.form.xpAmt)+num(state.form.retailAmt);
          const g = num(state.form.guestsToday);
          const a = g > 0 ? t / g : 0;
          const btn = document.getElementById('submit-btn'); if(btn && !state.submitting) btn.textContent = 'Submit report — AIR ' + fmtMoney(a);
        }
        updateTargetsUI();
      };
      el.oninput = handler;
      if(el.tagName === 'SELECT') el.onchange = handler;
    });
    document.querySelectorAll('.day-block').forEach(b => { b.onclick = () => { if(b.disabled) return; setCruiseDay(b.dataset.day); }; });
    const submitBtn = document.getElementById('submit-btn'); if(submitBtn) submitBtn.onclick = submitEntry;
    const notYouBtn = document.getElementById('not-you-btn'); if(notYouBtn) notYouBtn.onclick = logout;
  }, 0);

  return frag;
}

function updateTargetsUI(){
  if(!state.form.name) return;
  state.targets.forEach(t => {
    const { value, pct, achieved } = computeTargetProgress(t);
    const fill = document.getElementById('target-fill-'+t.id);
    if(fill){ fill.style.width = pct + '%'; fill.classList.toggle('done', achieved); }
    const reward = document.getElementById('target-reward-'+t.id);

      reward.classList.toggle('earned', achieved);
      reward.innerHTML = achieved ? '&#127881; Earned' : '&#127873; '+escapeHtml(t.reward || 'Reward TBD');

    const count = document.getElementById('target-count-'+t.id);
    if(count){ count.textContent = fmtTargetValue(value,t.metric) + ' / ' + fmtTargetValue(t.value,t.metric); }

/* ---------- leaderboard ---------- */
// Shared with the Home screen's "Board position" tile and the History tab's AIR rank stat,
// so both always agree with what the Board tab itself shows.
function computeAirsRank(name){
  const byPerson = {};
  state.entries.forEach(e => { if(!byPerson[e.name]) byPerson[e.name]={total:0,guests:0}; byPerson[e.name].total+=entryTotal(e); byPerson[e.name].guests+=num(e.guestsToday); });
  const ranked = Object.keys(byPerson).sort((a,b) => {
    const airsA = byPerson[a].guests>0 ? byPerson[a].total/byPerson[a].guests : 0;
    const airsB = byPerson[b].guests>0 ? byPerson[b].total/byPerson[b].guests : 0;
    return airsB - airsA;
  });
  const idx = ranked.indexOf(name);
  return { rank: idx>=0 ? idx+1 : null, of: ranked.length };
}

// Cruise-to-date leaderboard: every CURRENT roster member (even with zero
// submissions yet) summed across every day, ranked by AIR — Average
// Individual Revenue, i.e. (Rebooking $ + Add On $ + XP $ + Retail $) /
// Guests served. Same formula as AIR above and as computeAirsRank, just
// with the full per-metric breakdown kept around instead of collapsing
// straight to a rank number. Scoped to state.roster only (not "anyone who
// ever has an entry") so someone removed from the roster — e.g. signed off
// the ship — drops off this leaderboard too, even though their past daily
// reports and sales history are still kept.
function computeCruiseToDate(){
  const byName = {};
  state.roster.forEach(n => {
    byName[n] = { name:n, position: state.rosterPositions[n] || '', rebookNum:0, rebookAmt:0, addonNum:0, addonAmt:0, xpNum:0, xpAmt:0, retailAmt:0, guests:0 };
  });
  state.entries.forEach(e => {
    const r = byName[e.name];
    if(!r) return; // not on the current roster — excluded from this leaderboard
    r.rebookNum += num(e.rebookNum); r.rebookAmt += num(e.rebookAmt);
    r.addonNum += num(e.addonNum); r.addonAmt += num(e.addonAmt);
    r.xpNum += num(e.xpNum); r.xpAmt += num(e.xpAmt);
    r.retailAmt += num(e.retailAmt); r.guests += num(e.guestsToday);
  });
  const rows = Object.values(byName).map(r => {
    const revenue = r.rebookAmt + r.addonAmt + r.xpAmt + r.retailAmt;
    const air = r.guests > 0 ? revenue / r.guests : 0;
    return { ...r, revenue, air };
  });
  rows.sort((a,b) => b.air - a.air);
  // Standout badges: whoever brought in the single highest $ in each category
  // cruise-to-date gets flagged, independent of their overall AIR rank.
  let bestXp = null, bestAddon = null, bestRebook = null, bestRetail = null;
  rows.forEach(r => {
    if(r.xpAmt > 0 && (!bestXp || r.xpAmt > bestXp.xpAmt)) bestXp = r;
    if(r.addonAmt > 0 && (!bestAddon || r.addonAmt > bestAddon.addonAmt)) bestAddon = r;
    if(r.rebookAmt > 0 && (!bestRebook || r.rebookAmt > bestRebook.rebookAmt)) bestRebook = r;
    if(r.retailAmt > 0 && (!bestRetail || r.retailAmt > bestRetail.retailAmt)) bestRetail = r;
  });
  return {
    rows,
    bestXp, bestAddon, bestRebook, bestRetail,
    bestXpName: bestXp ? bestXp.name : null,
    bestAddonName: bestAddon ? bestAddon.name : null,
    bestRebookName: bestRebook ? bestRebook.name : null,
    bestRetailName: bestRetail ? bestRetail.name : null,
  };
}

// Builds the offscreen page markup for the printable Cruise to Date leaderboard.
// footerNote is optional extra text (e.g. noting anyone manually excluded).
function buildCtdPrintableHTML(ctd, footerNote){
  const { rows, bestXp, bestAddon, bestRebook, bestRetail } = ctd;
  // Standard "1224" competition ranking so tied AIR values share a rank and
  // the next distinct value skips ahead, same as the reference leaderboard.
  const ranks = rows.map((r,i) => (i>0 && r.air === rows[i-1].air) ? null : i+1);
  for(let i=1;i<ranks.length;i++){ if(ranks[i]===null) ranks[i]=ranks[i-1]; }
  const badgeFor = (r) => {
    if(bestXp && r.name===bestXp.name) return 'BEST XP';
    if(bestAddon && r.name===bestAddon.name) return 'BEST ADD ON';
    if(bestRebook && r.name===bestRebook.name) return 'BEST REBOOKING';
    if(bestRetail && r.name===bestRetail.name) return 'BEST RETAIL';
    return null;
  };
  const rest = rows.slice(3);
  const restRanks = ranks.slice(3);
  const mid = Math.ceil(rest.length / 2);
  const renderCol = (list, listRanks) => list.map((r,i) => ctdListRowHtml(r, listRanks[i], badgeFor(r))).join('');

  return `<div id="ctd-pdf-page" style="position:fixed; left:-99999px; top:0; width:1600px; background:#FFFFFF; font-family:'Inter',system-ui,-apple-system,sans-serif; color:#111827; padding:48px 56px; box-sizing:border-box;">
    <div style="font-size:12px; font-weight:700; color:#2563EB; letter-spacing:0.02em; margin-bottom:6px;">${rows.length} therapists on this voyage</div>
    <div style="font-size:28px; font-weight:800; color:#111827; margin-bottom:4px;">Senses Spa &mdash; Performance Leaderboard</div>
    <div style="font-size:13px; color:#6B7280; margin-bottom:24px;">Disney Dream &middot; Ranked by AIR CTD across rebooking, add-ons, XP and retail</div>
    <div style="display:flex; gap:16px; margin-bottom:20px;">
      ${ctdPodiumCardHtml(rows[1], 2, false)}
      ${ctdPodiumCardHtml(rows[0], 1, true)}
      ${ctdPodiumCardHtml(rows[2], 3, false)}
    </div>
    <div style="display:flex; gap:14px; margin-bottom:26px;">
      ${ctdBadgeBoxHtml('BEST XP', bestXp, bestXp ? bestXp.xpAmt : 0)}
      ${ctdBadgeBoxHtml('BEST ADD ON', bestAddon, bestAddon ? bestAddon.addonAmt : 0)}
      ${ctdBadgeBoxHtml('BEST REBOOKING', bestRebook, bestRebook ? bestRebook.rebookAmt : 0)}
      ${ctdBadgeBoxHtml('BEST RETAIL', bestRetail, bestRetail ? bestRetail.retailAmt : 0)}
    </div>
    <div style="display:flex; gap:40px;">
      <div style="flex:1;">${renderCol(rest.slice(0, mid), restRanks.slice(0, mid))}</div>
      <div style="flex:1;">${renderCol(rest.slice(mid), restRanks.slice(mid))}</div>
    </div>
    ${footerNote ? `<div style="margin-top:18px; padding-top:12px; border-top:1px solid #F3F4F6; font-size:10.5px; color:#9CA3AF;">${escapeHtml(footerNote)}</div>` : ''}
  </div>`;
}
async function downloadCtdPdf(){
  const btn = document.getElementById('export-pdf-btn');
  clearExportError(btn);
  if(typeof html2canvas === 'undefined' || !window.jspdf){
    showExportError(btn, "Couldn't build the PDF — the export library didn't load. Check your connection and try again.");
    return;
  }
  const label = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Building PDF…'; }
  const holder = document.createElement('div');
  try {
    const ctd = computeCruiseToDate();
    holder.innerHTML = buildCtdPrintableHTML(ctd);
    document.body.appendChild(holder);
    const page = document.getElementById('ctd-pdf-page');
    const canvas = await html2canvas(page, { backgroundColor: '#FFFFFF', scale: 2 });
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:[canvas.width/2, canvas.height/2], orientation: canvas.width >= canvas.height ? 'landscape' : 'portrait' });
    doc.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, canvas.width/2, canvas.height/2);
    doc.save('senses-spa-leaderboard-' + new Date().toISOString().slice(0,10) + '.pdf');
  } catch(err){
    console.error(err);
    showExportError(btn, "Couldn't build the PDF. Check your connection and try again.");
  } finally {
    document.body.removeChild(holder);
    if(btn){ btn.disabled = false; btn.textContent = label; }
  }
}

/* ---------- ship's log: therapist trend chart ---------- */
function fmtMoneyFull(n){ return '$' + Number(n||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }

function buildTrendChartSVG(mySales){
  const w = 560, h = 230, padL = 10, padR = 10, padT = 32, padB = 40;
  const service = mySales.map(s => s.service);
  const retail = mySales.map(s => s.retail);
  const retailPct = mySales.map(s => { const t = s.service + s.retail; return t > 0 ? Math.round((s.retail / t) * 100) + '%' : '0%'; });
  const all = [...service, ...retail, 0];
  const min = Math.min(...all), max = Math.max(...all);
  const range = (max - min) || 1;
  const n = mySales.length;
  const stepX = n > 1 ? (w - padL - padR) / (n - 1) : 0;
  const toPts = vals => vals.map((v,i) => [padL + i*stepX, h - padB - ((v - min) / range) * (h - padT - padB)]);
  const sp = toPts(service), rp = toPts(retail);
  const line = arr => arr.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const area = arr => `${padL},${h-padB} ${line(arr)} ${(w-padR).toFixed(1)},${h-padB}`;

  // At each data point, whichever line sits higher on screen gets its label pushed
  // further up and the other pushed further down — so the two labels are always
  // driven apart, even where the lines converge or cross (was the overlap bug).
  const serviceAbove = service.map((_,i) => sp[i][1] <= rp[i][1]);
  const retailAbove = serviceAbove.map(v => !v);

  const dotsAndLabels = (arr, color, vals, aboveArr, extra) => arr.map((p,i) => {
    const above = aboveArr[i];
    const ty = above ? p[1] - 15 : p[1] + 23;
    let extraText = '';
    if(extra){
      const ty2 = above ? ty - 10 : ty + 10;
      extraText = `<text x="${p[0].toFixed(1)}" y="${ty2.toFixed(1)}" text-anchor="middle" font-family="Outfit, sans-serif" font-size="8.5" fill="${color}" opacity="0.75">${extra[i]}</text>`;
    }
    return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="#fff" stroke="${color}" stroke-width="2"/>` +
      `<text x="${p[0].toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-family="Outfit, sans-serif" font-size="10.5" font-weight="700" fill="${color}">${fmtMoney(vals[i])}<title>${escapeHtml(mySales[i].batchLabel)}: ${fmtMoneyFull(vals[i])}</title></text>` +
      extraText;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block;overflow:visible;">
    <defs>
      <linearGradient id="sr-area-service" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7B61FF" stop-opacity="0.18"/><stop offset="100%" stop-color="#7B61FF" stop-opacity="0"/></linearGradient>
      <linearGradient id="sr-area-retail" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4F6DF5" stop-opacity="0.14"/><stop offset="100%" stop-color="#4F6DF5" stop-opacity="0"/></linearGradient>
    </defs>
    <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="rgba(30,33,48,.12)" stroke-width="1"/>
    <polygon points="${area(sp)}" fill="url(#sr-area-service)"/>
    <polygon points="${area(rp)}" fill="url(#sr-area-retail)"/>
    <polyline points="${line(sp)}" fill="none" stroke="#7B61FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="${line(rp)}" fill="none" stroke="#4F6DF5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dotsAndLabels(sp, '#7B61FF', service, serviceAbove)}
    ${dotsAndLabels(rp, '#4F6DF5', retail, retailAbove, retailPct)}
  </svg>`;
}

function buildTrendComment(mySales){
  const n = mySales.length;
  if(n < 2) return 'Only one recap logged so far — a trend will appear once more are added.';
  const service = mySales.map(s => s.service);
  const retailPct = mySales.map(s => { const t = s.service + s.retail; return t > 0 ? (s.retail / t) * 100 : 0; });
  const labels = mySales.map(s => s.batchLabel);
  const servicePctChange = service[0] ? ((service[n-1]-service[0])/service[0]*100) : 0;
  const avgService = service.reduce((a,b)=>a+b,0)/n;
  const serviceSentence = Math.abs(servicePctChange) < 4
    ? `Service revenue has held fairly steady, averaging ${fmtMoney(avgService)} per recap.`
    : `Service revenue is ${servicePctChange>0?'up':'down'} ${Math.abs(servicePctChange).toFixed(0)}% from ${labels[0]} to ${labels[n-1]}.`;
  let maxSwing = 0, swingIdx = -1;
  for(let i=1;i<n;i++){ const diff = retailPct[i]-retailPct[i-1]; if(Math.abs(diff) > Math.abs(maxSwing)){ maxSwing = diff; swingIdx = i; } }
  let swingSentence = '';
  if(swingIdx > -1 && Math.abs(maxSwing) >= 8){
    swingSentence = ` Retail rate ${maxSwing>0?'jumped':'dropped'} ${Math.abs(maxSwing).toFixed(0)} points between ${labels[swingIdx-1]} and ${labels[swingIdx]}.`;
  }
  const retailMin = Math.min(...retailPct), retailMax = Math.max(...retailPct);
  const retailAvg = retailPct.reduce((a,b)=>a+b,0)/n;
  const retailSentence = ` Retail rate has ranged ${retailMin.toFixed(0)}%–${retailMax.toFixed(0)}%, averaging ${retailAvg.toFixed(0)}%.`;
  return serviceSentence + swingSentence + retailSentence;
}

async function downloadShipLogPdf(){
  const btn = document.getElementById('shiplog-download-btn');
  const card = document.querySelector('.shiplog-modal');
  if(!btn || !card) return;
  clearExportError(btn);
  if(typeof html2canvas === 'undefined' || !window.jspdf){
    showExportError(btn, "Couldn't build the PDF — the export library didn't load. Check your connection and try again.");
    return;
  }
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Building PDF…';
  try {
    const canvas = await html2canvas(card, { backgroundColor: '#FFFFFF', scale: 2 });
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:[canvas.width/2, canvas.height/2] });
    doc.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, canvas.width/2, canvas.height/2);
    doc.save((state.shipLogName || 'therapist').replace(/\s+/g,'_') + '_performance.pdf');
  } catch(err){
    console.error(err);
    showExportError(btn, "Couldn't build the PDF. Check your connection and try again.");
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

function renderShipLogModal(){
  const name = state.shipLogName;
  const allMine = state.salesData.filter(s => namesMatch(s.name, name)).sort((a,b) => a.batchId - b.batchId);
  if(allMine.length === 0) return null;

  // Group this therapist's recaps by voyage so past cruises are browsable,
  // not just the current one — most recent voyage first.
  const voyageIds = Array.from(new Set(allMine.map(s => s.voyageId || 1))).sort((a,b) => b - a);
  const activeVoyageId = (state.shipLogVoyageId !== null && voyageIds.includes(state.shipLogVoyageId))
    ? state.shipLogVoyageId : voyageIds[0];
  const mySales = allMine.filter(s => (s.voyageId || 1) === activeVoyageId);

  const sumService = mySales.reduce((a,s)=>a+s.service,0);
  const sumRetail = mySales.reduce((a,s)=>a+s.retail,0);
  const avgRetailPct = mySales.reduce((s,e) => { const t=e.service+e.retail; return s + (t>0 ? e.retail/t*100 : 0); }, 0) / mySales.length;

  const backdrop = document.createElement('div'); backdrop.className = 'shiplog-backdrop';
  backdrop.innerHTML = `

      ${voyageIds.length > 1 ? `<div class="shiplog-voyage-row">${voyageIds.map(vid => `<button class="subtab-btn shiplog-voyage-btn ${vid===activeVoyageId?'active':''}" data-voyage="${vid}">${escapeHtml(voyageLabel(vid, allMine.filter(s => (s.voyageId||1)===vid)))}</button>`).join('')}</div>` : ''}

        <div class="rp-kpi-card"><div class="rp-kpi-label">Total Service</div><div class="rp-kpi-val" data-count="${sumService}">$0</div></div>
        <div class="rp-kpi-card"><div class="rp-kpi-label">Total Retail</div><div class="rp-kpi-val" data-count="${sumRetail}">$0</div></div>
        <div class="rp-kpi-card"><div class="rp-kpi-label">Total Revenue</div><div class="rp-kpi-val" data-count="${sumService+sumRetail}">$0</div></div>
      </div>
      <div class="chart-wrap">
        ${buildTrendChartSVG(mySales)}

      </div>

      <div class="rp-comment">${buildTrendComment(mySales)}</div>
      <button class="shiplog-btn" id="shiplog-download-btn">Download this therapist's PDF</button>
    </div>`;
  backdrop.onclick = (e) => { if(e.target === backdrop) closeShipLog(); };
  setTimeout(() => {
    const c = document.getElementById('shiplog-close-btn'); if(c) c.onclick = closeShipLog;
    const d = document.getElementById('shiplog-download-btn'); if(d) d.onclick = downloadShipLogPdf;
    backdrop.querySelectorAll('.shiplog-voyage-btn[data-voyage]').forEach(b => b.onclick = () => selectShipLogVoyage(Number(b.dataset.voyage)));
    backdrop.querySelectorAll('.rp-kpi-val[data-count]').forEach(animateMoneyCount);
  }, 0);
  return backdrop;
}
function animateMoneyCount(el){
  const target = parseFloat(el.dataset.count);
  if(!isFinite(target)) return;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduceMotion){ el.textContent = fmtMoney(target); return; }
  const duration = 700;
  const start = performance.now();
  function tick(now){
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = fmtMoney(target * eased);
    if(t < 1) requestAnimationFrame(tick);
    else el.textContent = fmtMoney(target);
  }
  requestAnimationFrame(tick);
}

async function copyReminderMessage(text){
  try {
    await navigator.clipboard.writeText(text);
    state.copyMsg = 'Copied — paste it into your group chat.';

    const ta = document.getElementById('reminder-text');
    if(ta){ ta.removeAttribute('readonly'); ta.select(); document.execCommand('copy'); ta.setAttribute('readonly',''); }
    state.copyMsg = 'Copied — paste it into your group chat.';
  }
  render();
}

function currentVoyageSales(){
  return state.salesData.filter(s => (s.voyageId || 1) === state.voyageId);
}

function voyageLabel(vid, rows){
  if(vid === state.voyageId) return 'Current voyage';
  const sorted = rows.slice().sort((a,b) => a.batchId - b.batchId);
  const first = sorted[0], last = sorted[sorted.length - 1];
  if(!first) return `Voyage ${vid}`;
  return first.batchLabel === last.batchLabel ? first.batchLabel : `${first.batchLabel} – ${last.batchLabel}`;
}

function computeTeamOverview(rows){
  const source = rows || currentVoyageSales();
  // Group by normalized name so the same person doesn't get split into two rows
  // over a capitalization/whitespace difference in how the recap spelled them —
  // keep whichever exact spelling showed up first as the display name.
  const byKey = {};
  source.forEach(s => {
    const key = normName(s.name);
    if(!byKey[key]) byKey[key] = { name: s.name, rows: [] };
    byKey[key].rows.push(s);
  });
  return Object.values(byKey).map(({ name, rows: entryRows }) => {
    const rows = entryRows.slice().sort((a,b) => a.batchId - b.batchId);
    const service = rows.reduce((sum,r) => sum + num(r.service), 0);
    const retail = rows.reduce((sum,r) => sum + num(r.retail), 0);
    const total = service + retail;
    const retailPct = total > 0 ? Math.round((retail / total) * 100) : 0;
    const trend = rows.map(r => num(r.service) + num(r.retail));
    return { name, service, retail, total, retailPct, recaps: rows.length, trend };
  });
}

function buildSparklineSVG(values){
  if(values.length < 2){ return `<span style="color:var(--ink-faint);font-size:10px;">&mdash;</span>`; }
  const w = 66, h = 24, pad = 3;
  const max = Math.max(...values), min = Math.min(...values);
  const range = (max - min) || 1;
  const stepX = (w - pad*2) / (values.length - 1);
  const pts = values.map((v,i) => [ pad + i*stepX, pad + (h - pad*2) * (1 - (v - min) / range) ]);
  const d = pts.map((p,i) => (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  const up = values[values.length - 1] >= values[0];
  const color = up ? 'var(--green)' : 'var(--coral)';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.2" fill="${color}"/>
  </svg>`;
}

  ];
  const sortedOverview = overview.slice().sort((a,b) => b[state.teamSort] - a[state.teamSort]);
  const teamSec = document.createElement('div'); teamSec.className='section'; teamSec.style.marginTop='0'; teamSec.textContent = 'Team overview — this voyage'; frag.appendChild(teamSec);
  const teamPanel = document.createElement('div'); teamPanel.className='panel';
  if(overview.length === 0){
    teamPanel.innerHTML = `<div class="empty-state">Upload a recap to see the whole team side by side.</div>`;
  } else {
    teamPanel.innerHTML = `
      <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">
        ${TEAM_SORTS.map(s => `<button class="subtab-btn team-sort-btn ${state.teamSort===s.key?'active':''}" data-sort="${s.key}">${s.label}</button>`).join('')}
      </div>
      <div class="table-scroll"><table class="mtable">
        <thead><tr><th>Name</th><th>Service</th><th>Retail</th><th>Retail %</th><th>Total</th><th>Recaps</th><th>Trend</th></tr></thead>
        <tbody>${sortedOverview.map((t,i) => `<tr>
          <td class="name-cell">${i===0 ? '<span style="color:var(--green);margin-right:3px;" aria-hidden="true">&#9733;</span>' : ''}${escapeHtml(t.name)}</td>
          <td>${fmtMoney(t.service)}</td>
          <td>${fmtMoney(t.retail)}</td>
          <td>${t.retailPct}%</td>
          <td><strong>${fmtMoney(t.total)}</strong></td>
          <td>${t.recaps}</td>
          <td>${buildSparklineSVG(t.trend)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    `;
  }
  frag.appendChild(teamPanel);
  setTimeout(() => {
    teamPanel.querySelectorAll('.team-sort-btn[data-sort]').forEach(b => b.onclick = () => { state.teamSort = b.dataset.sort; render(); });
  }, 0);

  // Group this voyage's data into chronological batches — past voyages' batches
  // live on in each therapist's own Ship's Log history instead of cluttering this list.
  const batches = {};
  currentVoyageSales().forEach(s => {
    if(!batches[s.batchId]) batches[s.batchId] = { label: s.batchLabel, count: 0 };
    batches[s.batchId].count++;
  });
  const batchIds = Object.keys(batches).sort((a,b) => Number(b) - Number(a));

  const sec = document.createElement('div'); sec.className='section'; sec.textContent = 'Recap uploads so far'; frag.appendChild(sec);
  const listPanel = document.createElement('div'); listPanel.className='panel';
  if(batchIds.length === 0){ listPanel.innerHTML = `<div class="empty-state">No sales recaps uploaded yet this voyage.</div>`; }
  else {
    listPanel.innerHTML = `<div class="sub-status-list">` + batchIds.map(bid => {
      if(state.editingBatchLabelId === bid){
        return `<div class="sub-status-row on" style="justify-content:space-between; gap:8px;">
          <input class="form-input" id="batch-rename-input" value="${escapeHtml(state.editingBatchLabelValue)}" placeholder="e.g. Aug 31 AM" style="flex:1; padding:6px 10px; font-size:12px;">
          <span style="display:flex; gap:10px; align-items:center; flex-shrink:0;">
            <button class="rule-del" data-save-batch="${bid}" aria-label="Save label" style="color:var(--success);font-size:16px;">&#10003;</button>
            <button class="rule-del" data-cancel-batch aria-label="Cancel rename">&times;</button>
          </span>
        </div>`;
      }
      return `<div class="sub-status-row on" style="justify-content:space-between;">
        <span>${escapeHtml(batches[bid].label)} — ${batches[bid].count} therapists</span>
        <span style="display:flex; gap:12px; align-items:center; flex-shrink:0;">
          <button class="target-edit-link" data-rename-batch="${bid}" data-label="${escapeHtml(batches[bid].label)}" style="border:none;background:none;color:var(--blue);font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline;padding:0;">Rename</button>
          <button class="rule-del" data-batch="${bid}" aria-label="Delete this recap batch">&times;</button>
        </span>
      </div>`;
    }).join('') + `</div>`;
  }
  frag.appendChild(listPanel);
  setTimeout(() => {
    document.querySelectorAll('.rule-del[data-batch]').forEach(b => b.onclick = () => deleteSalesBatch(b.dataset.batch));
    document.querySelectorAll('[data-rename-batch]').forEach(b => b.onclick = () => startRenameBatch(b.dataset.renameBatch, b.dataset.label));
    document.querySelectorAll('[data-save-batch]').forEach(b => b.onclick = () => saveRenameBatch(b.dataset.saveBatch));
    document.querySelectorAll('[data-cancel-batch]').forEach(b => b.onclick = cancelRenameBatch);
    const renameInput = document.getElementById('batch-rename-input');
    if(renameInput){
      renameInput.oninput = e => state.editingBatchLabelValue = e.target.value;
      renameInput.onkeydown = e => { if(e.key === 'Enter') saveRenameBatch(state.editingBatchLabelId); if(e.key === 'Escape') cancelRenameBatch(); };
      renameInput.focus();
    }
  }, 0);

  // Per-therapist performance logs — same Ship's Log view therapists can open on
  // their own History tab, reachable here too so a manager can check anyone's trend.
  // Grouped by normalized name so a recap-spelling difference (case, spacing)
  // doesn't split one therapist into two separate rows here.
  const byName = {};
  state.salesData.forEach(s => {
    const key = normName(s.name);
    if(!byName[key]) byName[key] = { display: s.name, count:0, total:0 };
    byName[key].count++;
    byName[key].total += num(s.service) + num(s.retail);
  });
  const names = Object.keys(byName).sort((a,b) => byName[b].total - byName[a].total);

  const logSec = document.createElement('div'); logSec.className='section'; logSec.textContent = 'Therapist performance logs'; frag.appendChild(logSec);
  const logPanel = document.createElement('div'); logPanel.className='panel';
  if(names.length === 0){ logPanel.innerHTML = `<div class="empty-state">Once recaps are uploaded, each therapist's log shows up here.</div>`; }
  else {
    logPanel.innerHTML = `<div style="font-size:11px;color:var(--ink-soft);margin-bottom:10px;">Totals across every voyage on record — open a log to browse a therapist's past cruises.</div><div class="sub-status-list">` + names.map(n => `
      <div class="sub-status-row on clickable" data-name="${escapeHtml(byName[n].display)}" style="justify-content:space-between;">
        <span>${escapeHtml(byName[n].display)} <span style="color:var(--ink-faint);font-weight:600;">&middot; ${byName[n].count} recap${byName[n].count===1?'':'s'} &middot; ${fmtMoney(byName[n].total)}</span></span>
        <svg class="row-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </div>`).join('') + `</div>`;
  }
  frag.appendChild(logPanel);
  setTimeout(() => { logPanel.querySelectorAll('.sub-status-row[data-name]').forEach(r => r.onclick = () => openShipLog(r.dataset.name)); }, 0);

  const salesResetPanel = document.createElement('div'); salesResetPanel.className='panel danger-card';
  salesResetPanel.innerHTML = `
    <div class="section" style="margin-top:0;">Danger zone</div>
    <div class="danger-card-title">Reset all sales recaps</div>
    <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:12px;">Clears every sales recap you've ever uploaded — for every past cruise, not just this one — so you can start uploading fresh. Anyone's retail target progress that came from a recap upload will drop by that amount (retail typed directly into a daily report is untouched). This is separate from "Reset for new voyage" in Settings and doesn't affect daily numbers, targets, roster, or tip rules.</div>
    ${state.salesMsg ? `<div class="${state.salesMsg.type==='error'?'error-msg':'confirm-msg'}">${escapeHtml(state.salesMsg.text)}</div>` : ''}
    ${state.salesResetArmed ? `
      <div class="error-msg" role="alert">This can't be undone. Permanently clear all ${state.salesData.length} recap ${state.salesData.length===1?'entry':'entries'} on file?</div>
      <div style="display:flex; gap:8px;">
        <button class="save-rule-btn" id="sales-reset-cancel" style="background:var(--neo-base); color:var(--ink); box-shadow:4px 4px 8px var(--neo-dark), -4px -4px 8px var(--neo-light);">Cancel</button>
        <button class="save-rule-btn" id="sales-reset-confirm" style="background:var(--coral);">Yes, clear all recaps</button>
      </div>
    ` : `<button class="save-rule-btn" id="sales-reset-start" style="background:var(--coral);" ${state.salesData.length===0?'disabled':''}>Reset all recaps</button>`}
  `;
  frag.appendChild(salesResetPanel);
  setTimeout(() => {
    const startBtn = document.getElementById('sales-reset-start'); if(startBtn) startBtn.onclick = armSalesReset;
    const cancelBtn = document.getElementById('sales-reset-cancel'); if(cancelBtn) cancelBtn.onclick = cancelSalesReset;
    const confirmBtn = document.getElementById('sales-reset-confirm'); if(confirmBtn) confirmBtn.onclick = resetAllSalesRecaps;
  }, 0);

  return frag;
}

function renderRosterSub(){
  const frag = document.createDocumentFragment();
  const mp = document.createElement('div'); mp.className='panel';

  if(state.rosterImportPreview){
    const { rows, toAdd, toRemove } = state.rosterImportPreview;
    const addSet = new Set(toAdd), removeSet = new Set(toRemove);
    mp.innerHTML = `
      <div class="section" style="margin-top:0;">Review import — ${rows.length} in file &middot; <span style="color:#16A34A;">${toAdd.length} new</span> &middot; <span style="color:var(--coral);">${toRemove.length} removed</span></div>
      <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;">This replaces the whole roster with this file, in this exact order. Anyone not in the file is removed from the roster (their past daily reports and sales history are kept, they just won't show up in rosters or leaderboards anymore).</div>
      <div class="roster-list" style="max-height:280px;overflow-y:auto;">
        ${rows.map(r => `<div class="roster-chip" style="${addSet.has(r.name)?'border-color:rgba(22,163,74,0.4);':''}">${escapeHtml(r.name)}${r.position ? `<span style="color:var(--ink-faint);font-weight:600;"> &middot; ${escapeHtml(r.position)}</span>` : ''}${addSet.has(r.name)?' <span style="color:#16A34A;font-weight:800;">NEW</span>':''}</div>`).join('')}
        ${toRemove.map(n => `<div class="roster-chip" style="border-color:rgba(var(--coral-rgb),0.4);opacity:0.7;text-decoration:line-through;">${escapeHtml(n)} <span style="color:var(--coral);font-weight:800;text-decoration:none;">REMOVING</span></div>`).join('')}
      </div>
      ${state.rosterImportMsg ? `<div class="${state.rosterImportMsg.type==='error'?'error-msg':'confirm-msg'}">${escapeHtml(state.rosterImportMsg.text)}</div>` : ''}
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button class="save-rule-btn" id="roster-import-cancel" style="background:var(--neo-base); color:var(--ink); box-shadow:4px 4px 8px var(--neo-dark), -4px -4px 8px var(--neo-light);">Cancel</button>
        <button class="save-rule-btn" id="roster-import-confirm" style="background:var(--green,#16A34A);">Confirm — update roster</button>
      </div>
    `;
    frag.appendChild(mp);
    setTimeout(() => {
      const c = document.getElementById('roster-import-cancel'); if(c) c.onclick = cancelRosterImport;
      const k = document.getElementById('roster-import-confirm'); if(k) k.onclick = confirmRosterImport;
    }, 0);
  } else {
    mp.innerHTML = `
      <div class="muster-drop" id="muster-drop">
        <div class="muster-drop-label">Import roster</div>
        <div class="muster-drop-sub">Upload an Excel (.xlsx), .csv, or .txt muster list — Name column required, Position/Role column optional. The file's row order becomes the roster order, and this replaces the whole roster (adds new names, removes anyone missing from the file).</div>
        <input type="file" id="muster-file" accept=".txt,.csv,.xlsx,.xls" style="display:none;">
      </div>
      ${state.rosterImportMsg ? `<div class="${state.rosterImportMsg.type==='error'?'error-msg':'confirm-msg'}">${escapeHtml(state.rosterImportMsg.text)}</div>` : ''}
    `;
    frag.appendChild(mp);
    setTimeout(() => {
      const drop=document.getElementById('muster-drop'), fi=document.getElementById('muster-file');
      if(drop && fi){ drop.onclick=()=>fi.click(); fi.onchange=e=>{ handleRosterFile(e.target.files[0]); fi.value=''; }; }
    }, 0);
  }

  const rp = document.createElement('div'); rp.className='panel';
  rp.innerHTML = `
    <div class="section" style="margin-top:0;">Current roster &middot; ${state.roster.length}</div>
    ${state.rosterMsg ? `<div class="${state.rosterMsg.type==='error'?'error-msg':'confirm-msg'}">${escapeHtml(state.rosterMsg.text)}</div>` : ''}
    <div class="roster-list">
      ${state.roster.length===0 ? '<span style="color:var(--ink-soft);font-size:13px;">Import a roster above, or add names below.</span>' :
        state.roster.map(n=>`<div class="roster-chip">${escapeHtml(n)}${state.rosterPositions[n] ? `<span style="color:var(--ink-faint);font-weight:600;"> &middot; ${escapeHtml(state.rosterPositions[n])}</span>` : ''}<button data-name="${escapeHtml(n)}" class="rm-roster">&times;</button></div>`).join('')}
    </div>
    <div class="add-roster-row"><input type="text" id="roster-input" placeholder="Add team member name" value="${escapeHtml(state.rosterInput)}"><button id="roster-add">Add</button></div>
  `;
  frag.appendChild(rp);
  setTimeout(() => {
    document.querySelectorAll('.rm-roster').forEach(b => b.onclick = () => removeRosterName(b.dataset.name));
    const input=document.getElementById('roster-input');
    if(input){ input.oninput=e=>state.rosterInput=e.target.value; input.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); addRosterName(); } }; }
    const addBtn=document.getElementById('roster-add'); if(addBtn) addBtn.onclick=addRosterName;
  }, 0);

  // Each therapist sets their own PIN on first login now (see renderLoginGate /
  // attemptLogin) — this is just the manager-side "I forgot it" escape hatch.
  const pinPanel = document.createElement('div'); pinPanel.className='panel';
  pinPanel.innerHTML = `
    <div class="section" style="margin-top:0;">Therapist PINs</div>
    <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:12px;">Everyone creates their own 4-digit PIN the first time they log in. If someone forgets theirs, reset it here — they'll be prompted to set a new one next time.</div>
    ${state.pinResetMsg ? `<div class="${state.pinResetMsg.type==='error'?'error-msg':'confirm-msg'}">${escapeHtml(state.pinResetMsg.text)}</div>` : ''}
    ${state.roster.length===0 ? '<span style="color:var(--ink-soft);font-size:13px;">Add therapists to the roster first.</span>' :
      state.roster.map(n => {
        const hasPin = !!state.staffPins[n];
        const armed = state.pinResetArmedName === n;
        return `<div class="pin-row">
          <div class="pin-row-name">${escapeHtml(n)}${state.rosterPositions[n] ? `<span class="pin-row-role"> &middot; ${escapeHtml(state.rosterPositions[n])}</span>` : ''}</div>
          <div class="pin-row-status ${hasPin?'set':'unset'}">${hasPin?'PIN set':'Not set yet'}</div>
          ${armed
            ? `<div class="pin-reset-confirm">Reset? <button class="pin-reset-yes" data-name="${escapeHtml(n)}">Yes</button><button class="pin-reset-no">Cancel</button></div>`
            : (hasPin ? `<button class="pin-reset-btn" data-name="${escapeHtml(n)}">Reset PIN</button>` : '')}
        </div>`;
      }).join('')}
  `;
  frag.appendChild(pinPanel);
  setTimeout(() => {
    pinPanel.querySelectorAll('.pin-reset-btn').forEach(b => b.onclick = () => armPinReset(b.dataset.name));
    pinPanel.querySelectorAll('.pin-reset-yes').forEach(b => b.onclick = () => resetStaffPin(b.dataset.name));
    pinPanel.querySelectorAll('.pin-reset-no').forEach(b => b.onclick = cancelPinReset);
  }, 0);

  return frag;
}

function renderReportsSub(){
  const frag = document.createDocumentFragment();

  if(state.reportsDay === null){
    const daysWithEntries = state.entries.map(e => e.cruiseDay);
    state.reportsDay = daysWithEntries.length > 0 ? Math.max(...daysWithEntries) : 1;
  }

  // Day 1 / Day 2 / … buttons plus a Cruise to Date tab, instead of a dropdown —
  // each day is its own roster-prefilled grid (mirrors the Excel export's
  // per-day sheets); Cruise to Date is the whole-voyage ranked leaderboard.
  const tabRow = document.createElement('div');
  tabRow.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;';
  const dayBtns = Array.from({length: state.voyageDays}, (_,i) => i+1).map(d =>
    `<button type="button" class="subtab-btn rep-day-btn ${state.reportsMode==='day' && d===state.reportsDay ? 'active':''}" data-day="${d}">Day ${d}</button>`
  ).join('');
  tabRow.innerHTML = dayBtns + `<button type="button" class="subtab-btn rep-ctd-btn ${state.reportsMode==='ctd'?'active':''}">Cruise to Date</button>`;
  frag.appendChild(tabRow);
  setTimeout(() => {
    tabRow.querySelectorAll('.rep-day-btn').forEach(b => b.onclick = () => { state.reportsMode='day'; state.reportsDay=Number(b.dataset.day); render(); });
    const ctdBtn = tabRow.querySelector('.rep-ctd-btn'); if(ctdBtn) ctdBtn.onclick = () => { state.reportsMode='ctd'; render(); };
  }, 0);

  const tp = document.createElement('div'); tp.className='panel';
  if(state.roster.length===0){
    tp.innerHTML = `<div class="empty-state">Add therapists to the roster to see reports.</div>`;
  } else if(state.reportsMode === 'ctd'){
    const ctd = computeCruiseToDate();
    const { rows, bestXpName, bestAddonName, bestRebookName, bestRetailName } = ctd;
    const medal = (i) => i===0 ? '🥇' : i===1 ? '🥈' : i===2 ? '🥉' : '';
    tp.innerHTML = `<div class="table-scroll"><table class="mtable">
      <thead><tr><th>#</th><th>Name</th><th>Role</th><th>Rebook #</th><th>Rebook $</th><th>Add On #</th><th>Add On $</th><th>XP #</th><th>XP $</th><th>Retail $</th><th>Guests</th><th>AIR CTD</th><th></th></tr></thead>
      <tbody>${rows.map((r,i) => {
        const badges = [
          r.name===bestXpName ? '<span class="row-pill on" title="Highest XP $ cruise-to-date">⭐ Best XP</span>' : '',
          r.name===bestAddonName ? '<span class="row-pill on" title="Highest Add On $ cruise-to-date">⭐ Best Add On</span>' : '',
          r.name===bestRebookName ? '<span class="row-pill on" title="Highest Rebooking $ cruise-to-date">⭐ Best Rebooking</span>' : '',
          r.name===bestRetailName ? '<span class="row-pill on" title="Highest Retail $ cruise-to-date">⭐ Best Retail</span>' : ''
        ].filter(Boolean).join(' ');
        return `<tr><td>${medal(i)||i+1}</td><td class="name-cell">${escapeHtml(r.name)}</td><td style="color:var(--ink-soft);">${escapeHtml(r.position)||'—'}</td><td>${r.rebookNum}</td><td>${fmtMoney(r.rebookAmt)}</td><td>${r.addonNum}</td><td>${fmtMoney(r.addonAmt)}</td><td>${r.xpNum}</td><td>${fmtMoney(r.xpAmt)}</td><td>${fmtMoney(r.retailAmt)}</td><td>${r.guests}</td><td><strong>${fmtMoney(r.air)}</strong></td><td>${badges}</td></tr>`;
      }).join('')}</tbody>
    </table></div><div style="font-size:11px;color:var(--ink-soft);margin-top:8px;">AIR CTD = (Rebooking $ + Add On $ + XP $ + Retail $) &divide; Guests, summed across the whole voyage so far. Highest AIR sorts to the top.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
      <button class="export-btn" id="export-btn" style="flex:1;">Export to Excel (by day)</button>
      <button class="export-btn" id="export-pdf-btn" style="flex:1;">Export leaderboard PDF</button>
    </div>`;
  } else {
    const day = state.reportsDay;
    const rows = state.roster.map(n => ({ name: n, e: state.entries.find(x => x.cruiseDay === day && x.name === n) }));
    const editField = (key, val) => `<input type="number" step="any" class="mtable-edit-input" data-field="${key}" value="${escapeHtml(String(val))}">`;
    const rowHtml = ({name, e}) => {
      if(!e){
        return `<tr><td class="name-cell">${escapeHtml(name)}</td><td colspan="12" style="color:var(--ink-faint);font-style:italic;">Not submitted yet</td></tr>`;
      }
      if(state.editingEntryId === e.id){
        const f = state.editEntryForm;
        const liveTotal = num(f.rebookAmt) + num(f.addonAmt) + num(f.xpAmt) + num(f.retailAmt);
        return `<tr>
          <td class="name-cell">${escapeHtml(name)}</td>
          <td>${editField('rebookNum', f.rebookNum)}</td>
          <td>${editField('rebookAmt', f.rebookAmt)}</td>
          <td>${editField('addonNum', f.addonNum)}</td>
          <td>${editField('addonAmt', f.addonAmt)}</td>
          <td>${editField('xpNum', f.xpNum)}</td>
          <td>${editField('xpAmt', f.xpAmt)}</td>
          <td>${editField('retailAmt', f.retailAmt)}</td>
          <td>${editField('guestsToday', f.guestsToday)}</td>
          <td><strong id="edit-total-${e.id}">${fmtMoney(liveTotal)}</strong></td>
          <td>${editField('packagesNum', f.packagesNum)}</td>
          <td>${editField('touchPoints', f.touchPoints)}</td>
          <td style="white-space:nowrap;"><button type="button" class="mtable-row-btn save" data-save="${e.id}">Save</button><button type="button" class="mtable-row-btn cancel" data-cancel-edit="1">Cancel</button></td>
        </tr>`;
      }
      if(state.deleteEntryArmedId === e.id){
        return `<tr>
          <td class="name-cell">${escapeHtml(name)}</td>
          <td colspan="11" style="color:var(--coral);font-weight:700;">Delete ${escapeHtml(name)}'s Day ${day} report? They'll be able to submit that day again.</td>
          <td style="white-space:nowrap;"><button type="button" class="mtable-row-btn delete" data-confirm-delete="${e.id}">Confirm</button><button type="button" class="mtable-row-btn cancel" data-cancel-delete="1">Cancel</button></td>
        </tr>`;
      }
      return `<tr>
        <td class="name-cell">${escapeHtml(name)}</td>
        <td>${e.rebookNum}</td><td>${fmtMoney(e.rebookAmt)}</td>
        <td>${e.addonNum}</td><td>${fmtMoney(e.addonAmt)}</td>
        <td>${e.xpNum}</td><td>${fmtMoney(e.xpAmt)}</td>
        <td>${fmtMoney(e.retailAmt)}</td><td>${e.guestsToday}</td>
        <td><strong>${fmtMoney(entryTotal(e))}</strong></td>
        <td>${e.packagesNum}</td><td>${e.touchPoints}</td>
        <td style="white-space:nowrap;"><button type="button" class="mtable-row-btn edit" data-edit="${e.id}">Edit</button><button type="button" class="mtable-row-btn delete" data-delete="${e.id}">Delete</button></td>
      </tr>`;
    };
    tp.innerHTML = `
      ${state.entryEditMsg ? `<div class="${state.entryEditMsg.type==='error'?'error-msg':'confirm-msg'}">${escapeHtml(state.entryEditMsg.text)}</div>` : ''}
      <div class="table-scroll"><table class="mtable">
      <thead><tr><th>Name</th><th>Rebook #</th><th>Rebook $</th><th>Add On #</th><th>Add On $</th><th>XP #</th><th>XP $</th><th>Retail $</th><th>Guests</th><th>Total $</th><th>Pkgs</th><th>Touch</th><th></th></tr></thead>
      <tbody>${rows.map(rowHtml).join('')}</tbody>
    </table></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
      <button class="export-btn" id="export-btn" style="flex:1;">Export to Excel (by day)</button>
      <button class="export-btn" id="print-day-btn" style="flex:1;">Print Day report</button>
    </div>`;
  }
  frag.appendChild(tp);
  setTimeout(() => {
    const b=document.getElementById('export-btn'); if(b) b.onclick=() => exportExcelByDay('export-btn');
    const printBtn=document.getElementById('print-day-btn'); if(printBtn) printBtn.onclick=printDayReport;
    document.querySelectorAll('[data-edit]').forEach(btn => btn.onclick = () => startEditEntry(btn.dataset.edit));
    document.querySelectorAll('[data-cancel-edit]').forEach(btn => btn.onclick = cancelEditEntry);
    document.querySelectorAll('[data-save]').forEach(btn => btn.onclick = () => saveEditedEntry());
    document.querySelectorAll('[data-delete]').forEach(btn => btn.onclick = () => armDeleteEntry(btn.dataset.delete));
    document.querySelectorAll('[data-cancel-delete]').forEach(btn => btn.onclick = cancelDeleteEntry);
    document.querySelectorAll('[data-confirm-delete]').forEach(btn => btn.onclick = () => deleteEntryConfirmed(btn.dataset.confirmDelete));
    document.querySelectorAll('.mtable-edit-input').forEach(inp => {
      inp.oninput = () => {
        if(!state.editEntryForm) return;
        state.editEntryForm[inp.dataset.field] = inp.value;
        if(['rebookAmt','addonAmt','xpAmt','retailAmt'].includes(inp.dataset.field)){
          const row = inp.closest('tr');
          const totalEl = row && row.querySelector('strong[id^="edit-total-"]');
          if(totalEl){
            const f = state.editEntryForm;
            totalEl.textContent = fmtMoney(num(f.rebookAmt)+num(f.addonAmt)+num(f.xpAmt)+num(f.retailAmt));
          }
        }
      };
    });
    const pb=document.getElementById('export-pdf-btn'); if(pb) pb.onclick=downloadCtdPdf;
  }, 0);
  return frag;
}

function renderRulesSub(){
  const frag = document.createDocumentFragment();
  const listPanel = document.createElement('div'); listPanel.className='panel';
  if(state.rules.length===0){ listPanel.innerHTML = `<div class="empty-state">No tip rules yet — add one below.</div>`; }
  else {
    listPanel.innerHTML = state.rules.map(r => `<div class="rule-card">
      <button class="rule-del" data-id="${r.id}" aria-label="Delete rule">&times;</button>
      <div class="rule-cond"><span class="rule-pill">${escapeHtml(metricLabel(r.metric))}</span><span class="rule-pill op">${r.op==='lt'?'is less than':'is greater than'}</span><span class="rule-pill">${r.value}</span></div>
      <div class="rule-comment">Show: <b>"${escapeHtml(r.comment)}"</b></div>
      <button class="rule-edit-link" data-id="${r.id}">Edit this rule</button>
    </div>`).join('');
  }
  frag.appendChild(listPanel);
  setTimeout(() => {
    document.querySelectorAll('.rule-del').forEach(b => b.onclick = () => deleteRule(b.dataset.id));
    document.querySelectorAll('.rule-edit-link').forEach(b => b.onclick = () => startEditRule(b.dataset.id));
  }, 0);

  const sec = document.createElement('div'); sec.className='section'; sec.textContent = state.editingRuleId ? 'Edit rule' : 'New rule'; frag.appendChild(sec);
  const np = document.createElement('div'); np.className='new-rule-card';
  const nr = state.newRule;
  np.innerHTML = `
    ${state.ruleMsg ? `<div class="${state.ruleMsg.type==='error'?'error-msg':'confirm-msg'}">${escapeHtml(state.ruleMsg.text)}</div>` : ''}
    <div class="form-row"><div class="form-label">Metric</div><select class="form-select" id="rule-metric">${METRICS.map(m=>`<option value="${m.key}" ${nr.metric===m.key?'selected':''}>${m.label}</option>`).join('')}</select></div>
    <div class="form-row"><div class="form-label">Condition</div><select class="form-select" id="rule-op"><option value="lt" ${nr.op==='lt'?'selected':''}>is less than</option><option value="gt" ${nr.op==='gt'?'selected':''}>is greater than</option></select></div>
    <div class="form-row"><div class="form-label">Value</div><input type="number" class="form-input" id="rule-value" value="${nr.value}" placeholder="e.g. 2"></div>
    <div class="form-row"><div class="form-label">Comment to show</div><textarea class="form-textarea" id="rule-comment" placeholder="What should staff see?">${escapeHtml(nr.comment)}</textarea></div>
    <div style="display:flex; gap:8px;">
      ${state.editingRuleId ? `<button class="save-rule-btn" id="rule-cancel" style="background:var(--neo-base); color:var(--ink); box-shadow:4px 4px 8px var(--neo-dark), -4px -4px 8px var(--neo-light);">Cancel</button>` : ''}
      <button class="save-rule-btn" id="rule-save">${state.editingRuleId ? 'Save changes' : 'Save rule'}</button>
    </div>
  `;
  frag.appendChild(np);
  setTimeout(() => {
    document.getElementById('rule-metric').onchange = e => state.newRule.metric = e.target.value;
    document.getElementById('rule-op').onchange = e => state.newRule.op = e.target.value;
    document.getElementById('rule-value').oninput = e => state.newRule.value = e.target.value;
    document.getElementById('rule-comment').oninput = e => state.newRule.comment = e.target.value;
    document.getElementById('rule-save').onclick = saveNewRule;
    const cancelBtn = document.getElementById('rule-cancel'); if(cancelBtn) cancelBtn.onclick = cancelEditRule;
  }, 0);
  return frag;
}

function renderTargetsSub(){
  const frag = document.createDocumentFragment();
  const listPanel = document.createElement('div'); listPanel.className='panel';
  if(state.targets.length===0){ listPanel.innerHTML = `<div class="empty-state">No targets yet — add one below.</div>`; }
  else {
    listPanel.innerHTML = state.targets.map(t => `<div class="rule-card">
      <button class="target-del" data-id="${t.id}" aria-label="Delete target" style="float:right;border:none;background:none;color:var(--coral);font-weight:700;cursor:pointer;font-size:13px;">&times;</button>
      <div class="rule-cond"><span class="rule-pill">${escapeHtml(t.name)}</span><span class="rule-pill op">${escapeHtml(targetMetricLabel(t.metric))}</span><span class="rule-pill">${t.value}</span></div>
      <div class="rule-comment">Reward: <b>${t.reward ? escapeHtml(t.reward) : '—'}</b>${t.resetVersion ? ` &middot; <span style="color:var(--ink-faint);">reset ${t.resetVersion}&times;</span>` : ''}</div>
      <div style="display:flex; gap:14px; margin-top:8px;">
        <button class="target-edit-link" data-id="${t.id}" style="border:none;background:none;color:var(--blue);font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline;padding:0;">Edit this target</button>
        <button class="target-reset-link" data-id="${t.id}" title="Starts this target back at 0 for everyone — doesn't touch daily numbers or delete the target" style="border:none;background:none;color:var(--gold);font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline;padding:0;">Reset progress</button>
      </div>
