  setTimeout(() => {
    document.querySelectorAll('.target-del').forEach(b => b.onclick = () => deleteTarget(b.dataset.id));
    document.querySelectorAll('.target-edit-link').forEach(b => b.onclick = () => startEditTarget(b.dataset.id));
    document.querySelectorAll('.target-reset-link').forEach(b => b.onclick = () => resetTargetProgress(b.dataset.id));
  }, 0);

  const sec = document.createElement('div'); sec.className='section'; sec.textContent = state.editingTargetId ? 'Edit target' : 'New target'; frag.appendChild(sec);
  const np = document.createElement('div'); np.className='new-rule-card';
  const nt = state.newTarget;
  np.innerHTML = `
    ${state.targetMsg ? `<div class="${state.targetMsg.type==='error'?'error-msg':'confirm-msg'}">${escapeHtml(state.targetMsg.text)}</div>` : ''}
    <div class="form-row"><div class="form-label">Target name</div><input class="form-input" id="target-name" value="${escapeHtml(nt.name)}" placeholder="e.g. XP Champion"></div>
    <div class="form-row"><div class="form-label">Metric</div><select class="form-select" id="target-metric">${TARGET_METRICS.map(m=>`<option value="${m.key}" ${nt.metric===m.key?'selected':''}>${m.label}</option>`).join('')}</select></div>
    <div class="form-row"><div class="form-label">Target number</div><input type="number" class="form-input" id="target-value" value="${nt.value}" placeholder="e.g. 10"></div>
    <div class="form-row"><div class="form-label">Reward</div><input class="form-input" id="target-reward" value="${escapeHtml(nt.reward)}" placeholder="e.g. Extra day off, $20 gift card, Free treatment"></div>
    <div style="display:flex; gap:8px;">
      ${state.editingTargetId ? `<button class="save-rule-btn" id="target-cancel" style="background:var(--neo-base); color:var(--ink); box-shadow:4px 4px 8px var(--neo-dark), -4px -4px 8px var(--neo-light);">Cancel</button>` : ''}
      <button class="save-rule-btn" id="target-save">${state.editingTargetId ? 'Save changes' : 'Save target'}</button>
    </div>
  `;
  frag.appendChild(np);
  setTimeout(() => {
    document.getElementById('target-name').oninput = e => state.newTarget.name = e.target.value;
    document.getElementById('target-metric').onchange = e => state.newTarget.metric = e.target.value;
    document.getElementById('target-value').oninput = e => state.newTarget.value = e.target.value;
    document.getElementById('target-reward').oninput = e => state.newTarget.reward = e.target.value;
    document.getElementById('target-save').onclick = saveNewTarget;
    const cancelBtn = document.getElementById('target-cancel'); if(cancelBtn) cancelBtn.onclick = cancelEditTarget;
  }, 0);
  return frag;
}

function renderEngagementSub(){
  const frag = document.createDocumentFragment();
  const totalOpens = state.hubClicks.length;
  const engagedNames = new Set(state.hubClicks.map(c => c.name));
  const pct = state.roster.length ? Math.round((engagedNames.size / state.roster.length) * 100) : 0;

  const sum = document.createElement('div'); sum.className='eng-summary';
  sum.innerHTML = `<div class="eng-tile"><div class="eng-tile-n">${totalOpens}</div><div class="eng-tile-l">Opens</div></div><div class="eng-tile"><div class="eng-tile-n">${pct}%</div><div class="eng-tile-l">Of crew</div></div>`;
  frag.appendChild(sum);

  const sec = document.createElement('div'); sec.className='section'; sec.textContent='By crew member'; frag.appendChild(sec);
  const list = document.createElement('div'); list.className='eng-list';
  list.innerHTML = state.roster.map(name => {
    const clicks = state.hubClicks.filter(c => c.name === name);
    const lessons = Array.from(new Set(clicks.map(c => c.lesson)));
    const on = clicks.length > 0;
    return `<div class="eng-row"><div class="eng-name"><span class="eng-dot ${on?'on':'off'}"></span>${escapeHtml(name)}</div>
      <div class="eng-lessons">${on ? 'Opened: '+escapeHtml(lessons.join(', ')) : "Hasn't opened the hub yet"}</div></div>`;
  }).join('');
  frag.appendChild(list);
  return frag;
}

function initParticles(){
  const field = document.getElementById('particle-field');
  if(!field) return;
  const colors = ['rgba(var(--green-rgb),0.6)','rgba(var(--blue-rgb),0.55)'];
  let html = '';
  for(let i=0;i<24;i++){
    const left = Math.random()*100, top = Math.random()*100;
    const size = 1.5 + Math.random()*2.5;
    const color = colors[i % 2];
    const dur = (3 + Math.random()*4).toFixed(1);
    const delay = (Math.random()*5).toFixed(1);
    html += `<div class="particle" style="left:${left}%; top:${top}%; width:${size}px; height:${size}px; background:${color}; animation-duration:${dur}s; animation-delay:${delay}s;"></div>`;
  }
  field.innerHTML = html;
}
initParticles();
restoreSession();
loadData();
startLiveEntries();
// Registered once for the page's whole lifetime (rather than inside
// renderLoginGate, which reruns on every keystroke-free render and would
// otherwise stack up a fresh listener each time) — closes the login screen's
// name-search dropdown on any click outside it.
document.addEventListener('click', (e) => {
  const dropdown = document.getElementById('login-name-dropdown');
  if(dropdown && !e.target.closest('.name-combo')) dropdown.classList.remove('open');
});
</script>
