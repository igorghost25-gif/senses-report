/* ---------- entries ---------- */
async function submitEntry(){
  if(state.isAdmin) return; // admin must never submit a therapist report
  const f = state.form;
  if(!f.name){ state.submitError = 'Select your name.'; render(); return; }
  if(!f.cruiseDay){ state.submitError = 'Enter the day of cruise.'; render(); return; }
  // Neither a day that's already passed NOR "Close submissions" being on
  // block the form anymore — both just mean the report goes in as *late*
  // instead (see the `late` flag below): staff can still log a day they
  // forgot, finished after hours, were out sick for, or submit normally
  // while a manager has closed the window to finalize/print. Retail $/
  // Service $ from a late entry still count everywhere (Targets, cumulative
  // totals, Reports); it's only excluded from AIR/leaderboard math — see
  // isAirsEligible().
  const todayCruiseDay = computeCurrentCruiseDay();
  const isLate = !!(todayCruiseDay && num(f.cruiseDay) < todayCruiseDay) || state.submissionsClosed;
  state.submitting = true; state.submitError = null; render();

  // Medi Spa / Acupuncture: derive xpNum/xpAmt from the itemized breakdown
  // instead of the (unused, hidden) single-pair fields — see
  // isItemizedXpCategory/xpBreakdownSectionHTML. A row only counts once it
  // has both a valid roster name and a positive amount; a half-filled row
  // (name picked, no amount yet, or vice versa) is silently dropped rather
  // than blocking submission. Rebooking/Add-on don't apply to this category
  // — the form never shows them, and they're forced to 0 here regardless of
  // whatever's left over in state.form from a previous session.
  const itemized = isItemizedXpCategory(f.name);
  const validXpRows = itemized
    ? (f.xpBreakdown || []).filter(r => r.name && state.roster.includes(r.name) && num(r.amount) > 0)
    : [];
  // Itemized category has no standalone Guests tile — a therapist who sent
  // 3 guests logs ONE row (name + guests + amount) instead of duplicating
  // the referrer across 3 rows. The day's guestsToday is the sum of each
  // valid row's guest count; a blank guests field on an otherwise-valid row
  // defaults to 1 (the common case). Must match xpBreakdownSectionHTML's
  // guestTotal and refreshXpDayTotals' guestTotal exactly.
  const itemizedGuests = itemized
    ? validXpRows.reduce((s,r) => s + (num(r.guests) > 0 ? num(r.guests) : 1), 0)
    : 0;

  const entry = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2,8),
    name: f.name, cruiseDay: num(f.cruiseDay),
    rebookNum: itemized ? 0 : num(f.rebookNum), rebookAmt: itemized ? 0 : num(f.rebookAmt),
    addonNum: itemized ? 0 : num(f.addonNum), addonAmt: itemized ? 0 : num(f.addonAmt),
    xpNum: itemized ? validXpRows.length : num(f.xpNum),
    xpAmt: itemized ? validXpRows.reduce((s,r) => s + num(r.amount), 0) : num(f.xpAmt),
    // Only present for the itemized category — who referred each guest, how
    // many, and for how much, kept for the manager-side submission detail
    // popup and for A Drivers.
    ...(itemized ? { xpBreakdown: validXpRows.map(r => ({ name:r.name, guests: num(r.guests) > 0 ? num(r.guests) : 1, amount:num(r.amount) })) } : {}),
    // Only present for a standard (non-itemized) report whose Cross
    // promotion (XP) $ was confirmed and split by department — see
    // xpDeptRows/computeXpSplitGate/confirmXpSplit. Feeds Manager >
    // Performance > XP (computeXpDeptSummary/computeXpDeptByTherapist); it's
    // a detail layer on top of xpAmt, not a separate total — entryTotal()
    // still reads xpAmt directly and is unaffected by this breakdown.
    ...((!itemized && f.xpConfirmed) ? { xpDeptBreakdown: (f.xpDeptRows || []).filter(r => r.dept && num(r.amount) > 0).map(r => ({ dept:r.dept, amount:num(r.amount) })) } : {}),
    // Consultations booked but not yet closed — tracked separately from XP $
    // and deliberately left out of entryTotal()/AIR (see Manager >
    // Performance > Consultations / computeConsultations). Only meaningful
    // for the standard (non-itemized) form, which is the only one that
    // renders these tiles — see renderSubmitTab.
    mediConsult: itemized ? 0 : num(f.mediConsult),
    acuConsult: itemized ? 0 : num(f.acuConsult),
    retailAmt: num(f.retailAmt),
    // Service $ is tracked and summed just like Retail, but deliberately left
    // out of entryTotal()/AIR everywhere — see the "Service" section below.
    // The itemized category's form has no Service tile at all, so force 0.
    serviceAmt: itemized ? 0 : num(f.serviceAmt),
    guestsToday: itemized ? itemizedGuests : num(f.guestsToday),
    packagesNum: num(f.packagesNum), touchPoints: num(f.touchPoints),
    submittedAt: new Date().toISOString(),
    late: isLate
  };

  const current = await safeGet(K_ENTRIES, []);
  // Safety net behind the locked day-blocks in the UI: re-check against the
  // freshest data right before writing, in case another submission for this
  // name+day landed in the meantime (a second device, a slow connection).
  // Reports read the first matching entry per name+day and Cruise to Date
  // sums every entry, so a silent duplicate would either be ignored or
  // double-counted — refuse instead, and point them to their manager.
  if(current.some(e => e.name === f.name && e.cruiseDay === entry.cruiseDay)){
    state.submitting = false;
    state.submitError = `Day ${entry.cruiseDay} was already submitted for ${f.name}. Ask your manager to adjust it if something's wrong.`;
    render();
    return;
  }
  current.push(entry);
  const res = await safeSet(K_ENTRIES, current);
  state.submitting = false;
  if(res.ok){
    state.entries = current;
    // Tip Rules are written for the standard Rebooking/Add-on/XP form and
    // don't make sense against an itemized Medi Spa/Acupuncture report (its
    // rebookNum/addonNum/xpNum are always 0 or derived very differently) —
    // skip matching entirely for that category rather than surface an
    // irrelevant coaching tip.
    state.matchedTips = itemized ? [] : state.rules.filter(r => {
      const val = computeMetric(entry, r.metric);
      return r.op === 'lt' ? val < r.value : val > r.value;
    });
    state.submitConfirm = entry;
    state.form = emptyForm(f.name);
  } else {
    state.submitError = 'Could not save the report (' + res.error + '). Try again.';
  }
  render();
}
function startNewReport(){
  state.submitConfirm = null; state.matchedTips = []; state.submitError = null; render();
}

function cancelMoveEntry(){ state.movingEntryId = null; state.moveEntryDayInput = ''; render(); }
async function saveMovedEntry(){
  const id = state.movingEntryId;
  if(!id) return;
  const newDay = Math.round(num(state.moveEntryDayInput));
  if(!newDay || newDay < 1 || newDay > state.voyageDays){
    state.entryEditMsg = { type:'error', text:`Enter a day between 1 and ${state.voyageDays}.` };
    render(); return;
  }
  const current = await safeGet(K_ENTRIES, []);
  const idx = current.findIndex(x => x.id === id);
  if(idx === -1){
    state.entryEditMsg = { type:'error', text:'That entry no longer exists — it may have just been edited or removed elsewhere.' };
    state.movingEntryId = null; state.moveEntryDayInput = ''; render();
    return;
  }
  const entry = current[idx];
  if(newDay === entry.cruiseDay){

    return;

  if(current.some(x => x.id !== id && x.name === entry.name && x.cruiseDay === newDay)){

  current[idx] = updated;
  const res = await safeSet(K_ENTRIES, current);
  if(res.ok){

    // Jump the Reports view to the day it landed on, so the move is visible
    // immediately instead of the entry just disappearing from the day you were on.
    state.reportsMode = 'day'; state.reportsDay = newDay;
  } else {

  }

}

  // Late whenever the day has already passed OR submissions are currently

    packagesNum: num(f.packagesNum), touchPoints: num(f.touchPoints),

  } else {

  render();
}

// Manual Late/Normal override — flips a single entry's `late` flag directly,
// regardless of how it got set (auto-detected on submit, auto-flagged on a
// manager backfill, or a previous manual flip). Every AIR/leaderboard
// calculation reads this same flag, so a flip here takes effect everywhere
// immediately: Home's Total AIR, Board Position, the staff Leaderboard tab,
// Cruise to Date, and the History tab. Retail $/Service $ are unaffected
// either way — they never depended on this flag.

// Local snapshot used only as a fallback if the fresh fetch below fails.
function currentSettings(overrides){
  return { voyageDays: state.voyageDays, wipSections: state.wipSections, cruiseStartDate: state.cruiseStartDate, submissionsClosed: state.submissionsClosed, closedMessage: state.closedMessage, ...overrides };
}
// K_SETTINGS bundles several independently-editable fields (voyage length,
// cruise start date, WIP section toggles, submissions-closed, closed
// message) into ONE document. Every write here merges just its one field
// onto the server's CURRENT settings, not this tab's local copy — same
// staleness risk as staffPins/roster: without this, saving from a tab left
// open a while could silently revert whichever setting a different admin
// tab changed in the meantime, since each save PUTs the whole document.
async function freshSettings(overrides){
  const fresh = await safeGet(K_SETTINGS, currentSettings());
  return { ...currentSettings(), ...fresh, ...overrides };
}
async function saveCruiseStartDate(){
  const d = state.cruiseStartDateInput;
  if(!d){ state.cruiseDateMsg = { type:'error', text:'Pick a start date first.' }; render(); return; }
  state.cruiseDateMsg = { type:'ok', text:'Saving…' }; render();
  const res = await safeSet(K_SETTINGS, await freshSettings({ cruiseStartDate: d }));
  if(res.ok){ state.cruiseStartDate = d; state.cruiseDateMsg = { type:'ok', text:'Cruise start date saved.' }; }

  else { state.cruiseDateMsg = { type:'error', text:'Could not clear (' + res.error + ').' }; }

function computeCurrentCruiseDay(){
  if(!state.cruiseStartDate) return null;
  const start = new Date(state.cruiseStartDate + 'T00:00:00');
  if(isNaN(start.getTime())) return null;
  const now = new Date();
  const startMid = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const nowMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diffDays = Math.round((nowMid - startMid) / 86400000) + 1;
  return Math.min(Math.max(diffDays, 1), state.voyageDays || 30);
}

// Each therapist creates their own 4-digit PIN the first time they log in
// (see attemptLogin) — there's no shared PIN anymore. A manager can reset
// any one person's PIN from the Roster tab; that just clears their entry
// here, so their next login prompts them to set a fresh one.
async function createStaffPin(name, pin){
  state.loginSaving = true; render();
  // Merge onto the server's CURRENT staffPins, not this tab's local copy —
  // staffPins is only ever loaded once at page-load and never live-synced
  // (unlike entries), so a tab left open a while (e.g. on a manager's own
  // device) had a stale snapshot. Writing {...state.staffPins, [name]:pin}
  // straight from that stale snapshot would silently overwrite EVERY PIN
  // created by anyone else in the meantime, since this PUT replaces the
  // whole staffPins object. Re-fetching right before merging closes that gap.
  const fresh = await safeGet(K_STAFF_PINS, state.staffPins);
  const updated = { ...fresh, [name]: pin };
  const res = await safeSet(K_STAFF_PINS, updated);
  state.loginSaving = false;
  if(res.ok){
    state.staffPins = updated;
    state.loggedIn = true;
    state.isAdmin = false;
    state.form.name = name;
    state.loginPassword = '';
    state.loginError = null;
    saveSession();
  } else {
    state.loginError = 'Could not save your PIN (' + res.error + '). Try again.';
  }
  render();
}

async function resetStaffPin(name){

  const fresh = await safeGet(K_STAFF_PINS, state.staffPins);

async function resetVoyageData(){
  state.resetMsg = { type:'ok', text:'Clearing…' }; render();

  // Targets are intentionally separate from "Start new voyage": before the daily
  // entries get wiped below, carry each target's current progress forward as an
  // adjustment on the target itself, so every therapist's target progress reads
  // exactly the same right after the reset as it did right before it. Nothing
  // about targets resets here — the only way to zero one out is the "Reset
  // progress" button on that specific target. Merges onto the server's current
  // targets/voyageId, not this tab's local copy — same staleness risk as
  // staffPins/roster, and especially worth closing here since this is the
  // highest-stakes write in the app.
  const freshTargets = await safeGet(K_TARGETS, state.targets);
  const targetsUpdated = freshTargets.map(t => {
    const adjustments = { ...(t.adjustments || {}) };
    state.roster.forEach(n => {
      adjustments[n] = (adjustments[n] || 0) + computeStaffCumulative(n, t.metric);
    });
    return { ...t, adjustments };
  });

  const entriesRes = await safeSet(K_ENTRIES, []);
  const targetsRes = targetsUpdated.length > 0 ? await safeSet(K_TARGETS, targetsUpdated) : { ok:true };
  const freshVoyageId = await safeGet(K_VOYAGE, state.voyageId);
  const nextVoyageId = (freshVoyageId || 1) + 1;
  const voyageRes = await safeSet(K_VOYAGE, nextVoyageId);
  if(entriesRes.ok && targetsRes.ok && voyageRes.ok){
    state.entries = [];
    state.targets = targetsUpdated;
    state.voyageId = nextVoyageId;
    state.salesPendingFiles = [];
    state.resetArmed = false;
    state.resetMsg = { type:'ok', text:'Cleared — daily numbers are back to zero for the new voyage. Incentives were not affected — use "Reset progress" on an incentive if you want that one to start over. Sales recap history was kept so therapists can still look back at past cruises.' };
  } else {
    state.resetMsg = { type:'error', text:'Could not clear everything (' + (entriesRes.error || targetsRes.error || voyageRes.error) + '). Try again.' };
  }
  render();
}

  if(!t) return;

  // Replace this target's adjustments with -(current cumulative) for everyone, so
  // progress reads exactly 0 for the whole roster right now — without deleting the
  // target, without touching any daily entries or sales recaps, and without
  // affecting other targets. This overwrites any prior voyage-reset carry-forward

  // staleness risk as staffPins/roster.

  const fresh = await safeGet(K_TARGETS, state.targets);
  const updated = fresh.map(x => x.id === id ? { ...x, adjustments, resetVersion: (x.resetVersion||0) + 1 } : x);

  if(res.ok){ state.targets = updated; state.targetMsg = { type:'ok', text:`"${t.name}" progress reset to 0 for everyone.` }; }
  else { state.targetMsg = { type:'error', text:'Could not reset (' + res.error + ').' }; }
  render();
}

// Reads a picked photo, downscales it on a canvas, and re-encodes it as a
// compressed JPEG data URL — every lesson save PUTs the ENTIRE lessons array
// to Firebase (see K_LESSONS), so an un-shrunk photo would bloat that one
// document fast. Capping the long edge and quality keeps each lesson's photo
// in the tens-of-KB range instead of multiple MB straight off a phone camera.
function readLessonImage(file, maxDim, quality){
  maxDim = maxDim || 1280; quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    if(!file || !/^image\//.test(file.type)){ reject(new Error('Please choose an image file.')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read that photo.'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not read that photo.'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){ const scale = maxDim / Math.max(w, h); w = Math.round(w*scale); h = Math.round(h*scale); }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function handleLessonImagePick(file){
  if(!file) return;
  state.lessonMsg = { type:'ok', text:'Adding photo…' }; render();
  readLessonImage(file).then(dataUrl => {
    state.lessonForm.image = dataUrl;
    state.lessonMsg = null;
    render();
  }).catch(err => {
    state.lessonMsg = { type:'error', text: err.message || 'Could not read that photo.' };
    render();
  });
}
function removeLessonImage(){ state.lessonForm.image = null; render(); }

/* ---------- sales recap (multi-file staging) ---------- */
// Each dropped/selected file becomes its own pending card with its own editable
// label, so a manager catching up on several days at once can label each recap
// with the day it actually belongs to before they're all imported as separate
// batches in one go.
function handleSalesFiles(fileList){
  const files = Array.from(fileList || []).filter(Boolean);
  if(files.length === 0) return;
  const todayLabel = new Date().toLocaleDateString('en-US', { month:'short', day:'numeric' });
  files.forEach((file, i) => {
    const id = 'pf-' + Date.now() + '-' + i + '-' + Math.random().toString(36).slice(2,7);
    // Default the label (and the date this batch sorts/filters by) to whatever
    // date the filename itself names — "24 AUGUST.pdf" becomes "Aug 24", not
    // today's upload date — so a manager catching up on many days at once, and
    // not retyping every label by hand, still gets each recap dated correctly.
    // It's still just the pre-filled value in an editable field, so it can be
    // fixed by hand for any file that doesn't fit the pattern.
    const parsedDate = parseDateFromFilename(file.name);
    const label = parsedDate ? parsedDate.toLocaleDateString('en-US', { month:'short', day:'numeric' }) : todayLabel;
    state.salesPendingFiles.push({ id, fileName: file.name, status:'parsing', rows: [], label, parsedDateMs: parsedDate ? parsedDate.getTime() : null, error: null });
    parseOneSalesFile(file).then(rows => {
      const p = state.salesPendingFiles.find(x => x.id === id);
      if(!p) return;
      p.status = 'ok'; p.rows = rows;
      render();
    }).catch(err => {
      const p = state.salesPendingFiles.find(x => x.id === id);
      if(!p) return;
      p.status = 'error'; p.error = err.message || 'Could not read that file.';
      render();
    });
  });
  render();
}
function parseOneSalesFile(file){
  const isExcel = /\.(xlsx|xls)$/i.test(file.name);
  const isPdf = /\.pdf$/i.test(file.name);
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read that file.'));
    if(isExcel){
      reader.onload = (e) => {
        try {
          const wb = XLSX.read(e.target.result, { type:'array' });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
          resolve(parseSalesRowsPure(rows));
        } catch(err){ reject(new Error('Could not read that Excel file.')); }
      };
      reader.readAsArrayBuffer(file);
    } else if(isPdf){
      reader.onload = async (e) => {
        try {
          const fullText = await extractPdfText(e.target.result);
          resolve(parseEocRecapRows(fullText));
        } catch(err){ reject(err instanceof Error ? err : new Error('Could not read that PDF.')); }
      };
      reader.readAsArrayBuffer(file);
    } else {
      reader.onload = (e) => {
        try {
          const text = String(e.target.result || '');
          const lines = text.split(/\r?\n/).filter(Boolean);
          if(lines.length < 2){ reject(new Error('That file looks empty.')); return; }
          const headers = lines[0].split(',').map(h => h.trim());
          const rows = lines.slice(1).map(line => {
            const cells = line.split(',');
            const obj = {}; headers.forEach((h,i) => obj[h] = (cells[i]||'').trim()); return obj;
          });
          resolve(parseSalesRowsPure(rows));
        } catch(err){ reject(new Error('Could not read that file.')); }
      };
      reader.readAsText(file);
    }
  });
}
async function extractPdfText(arrayBuffer){
  if(!window.pdfjsLib) throw new Error('PDF library not loaded');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let fullText = '';
  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    fullText += content.items.map(it => it.str).join(' ') + ' ';
  }
  return fullText;
}
function parseEocRecapRows(text){
  // Matches the "EOC Sales Recap by Staff" PDF layout. The visible page reads
  // Name / Service Retail Total / Gratuity Auto-Gratuity Retail%, but pdf.js
  // extracts text items in the PDF's underlying draw order, not visual reading
  // order — for this report that order is actually:
  //   $Service  Name  $Gratuity  Retail%  $Retail  $Total  $AutoGratuity
  // (confirmed against a real recap: this exact order reproduces the report's
  // own footer totals to the cent). An earlier version of this regex assumed
  // Service came right before the "NN%" and Retail right after it — that
  // actually lines up with Gratuity and Retail, so it silently stored each
  // therapist's Gratuity $ as their "service" total (Retail was unaffected).
  const re = /\$\s*([\d,]+\.\d{2})\s+([A-Z][A-Za-z.'\-]+(?:\s+[A-Z][A-Za-z.'\-]+){1,4})\s+\$\s*[\d,]+\.\d{2}\s+\d+\s*%\s*\$\s*([\d,]+\.\d{2})\s*\$/g;
  const parsed = [];
  const seen = new Set();
  let match;
  while((match = re.exec(text)) !== null){
    const name = match[2].trim().replace(/\s+/g,' ');
    if(/^(Staff Name|Cruise Line|Vessel|Disney|OneSpaWorld|Total|Date)/i.test(name)) continue;
    if(seen.has(name)) continue; // avoid duplicate matches from overlapping pages
    seen.add(name);
    parsed.push({
      name,
      service: parseFloat(match[1].replace(/,/g,'')) || 0,
      retail: parseFloat(match[3].replace(/,/g,'')) || 0
    });
  }
  if(parsed.length === 0) throw new Error('Could not recognize this as an EOC Sales Recap. Try the Excel or CSV export instead.');
  return parsed;
}
function findCol(row, keywords){
  const keys = Object.keys(row);
  for(const kw of keywords){
    const match = keys.find(k => k.toLowerCase().includes(kw));
    if(match) return match;
  }
  return null;
}
function parseSalesRowsPure(rows){
  if(!rows || rows.length === 0) throw new Error('No rows found in that file.');
  const nameCol = findCol(rows[0], ['name']);
  const serviceCol = findCol(rows[0], ['service']);
  const retailCol = findCol(rows[0], ['retail']);
  if(!nameCol) throw new Error('Could not find a Name column in that file.');
  const parsed = rows.map(r => ({
    name: String(r[nameCol] || '').trim(),
    service: parseFloat(String(r[serviceCol!==null?serviceCol:''] || '0').replace(/[^0-9.\-]/g,'')) || 0,
    retail: parseFloat(String(r[retailCol!==null?retailCol:''] || '0').replace(/[^0-9.\-]/g,'')) || 0
  })).filter(r => r.name && !/^(name|total|grand total)$/i.test(r.name));
  if(parsed.length === 0) throw new Error('No usable rows found — check the file has Name, Service, and Retail columns.');
  return parsed;
}

function updatePendingSalesLabel(id, label){

async function importAllSalesData(){
  const ready = state.salesPendingFiles.filter(p => p.status === 'ok' && p.rows.length > 0);
  if(ready.length === 0){ state.salesMsg = { type:'error', text:'Nothing ready to import yet.' }; render(); return; }
  state.salesMsg = { type:'ok', text:'Saving…' }; render();
  const current = await safeGet(K_SALES, []);

  // Two recaps uploaded on the same calendar day (a common case) must not end up
  // with identical batch labels — otherwise the trend chart shows the same date
  // twice with no way to tell the points apart, and the auto-generated commentary
  // reads nonsense like "dropped between Aug 31 and Aug 31". Auto-generated labels
  // now include the time, and anything that still collides (including a label
  // someone typed by hand) gets a " #2", " #3"... suffix instead of overwriting.
  const usedLabels = new Set();
  const seenBatchIds = new Set();
  current.forEach(s => { if(!seenBatchIds.has(s.batchId)){ seenBatchIds.add(s.batchId); usedLabels.add(s.batchLabel); } });
  function uniqueBatchLabel(base){
    if(!usedLabels.has(base)){ usedLabels.add(base); return base; }
    let n = 2;
    while(usedLabels.has(base + ' #' + n)) n++;
    const label = base + ' #' + n;
    usedLabels.add(label);
    return label;
  }

  // When the filename gave us a real recap date, anchor batchId to THAT date
  // (not to right now) so the trend chart orders and dates batches by the day
  // the recap actually covers, not by upload order. A same-day-of-upload offset
  // plus the loop index keeps ids unique — both within this import and against
  // a separate import done another day for the same recap date — while staying
  // well under 24h, so it never crosses into a neighboring day's sort position.
  const dayOffset = Date.now() % (24*60*60*1000);
  let newEntries = [];
  ready.forEach((p, i) => {
    const batchId = (p.parsedDateMs != null ? p.parsedDateMs + dayOffset : Date.now()) + i;
    const baseLabel = (p.label || '').trim() || new Date().toLocaleDateString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
    const batchLabel = uniqueBatchLabel(baseLabel);
    newEntries = newEntries.concat(p.rows.map(r => ({ id: 'sr-'+batchId+'-'+r.name.replace(/\s+/g,'_'), name:r.name, batchId, batchLabel, service:r.service, retail:r.retail, voyageId: state.voyageId })));
  });
  const updated = [...current, ...newEntries];
  const res = await safeSet(K_SALES, updated);
  if(res.ok){
    state.salesData = updated;
    state.salesPendingFiles = state.salesPendingFiles.filter(p => !ready.includes(p));
    state.salesMsg = { type:'ok', text:`Imported ${ready.length} recap${ready.length===1?'':'s'} — ${newEntries.length} therapist entries added.` };
  } else {
    state.salesMsg = { type:'error', text:'Could not save (' + res.error + ').' };
  }
  render();
}

  const fresh = await safeGet(K_SALES, state.salesData);

  if(res.ok) state.salesData = updated;
  state.editingBatchLabelId = null;
  state.editingBatchLabelValue = '';
  render();
}

/* ---------- login ---------- */
function attemptLogin(){
  if(!state.loginName){ state.loginError = 'Select your name first.'; render(); return; }
  const existingPin = state.staffPins[state.loginName];
  if(!existingPin){
    // First time this name has logged in (or a manager reset it) — the
    // entered value creates their PIN instead of checking it.
    if(!/^\d{4}$/.test(state.loginPassword)){ state.loginError = 'Create a 4-digit PIN (numbers only).'; render(); return; }
    createStaffPin(state.loginName, state.loginPassword);
    return;
  }
  if(state.loginPassword !== existingPin){ state.loginError = 'Incorrect PIN.'; state.loginPassword = ''; render(); return; }
  state.loggedIn = true;
  state.isAdmin = false;
  state.form.name = state.loginName;
  state.loginPassword = '';
  state.loginError = null;
  saveSession();
  render();
}
function saveSession(){
  // Only ever save a therapist identity. Admin sessions must never persist.
  if(state.isAdmin) return;
  try { localStorage.setItem('senses_session', JSON.stringify({ name: state.form.name })); } catch(e){}
}
function restoreSession(){
  try {
    const raw = localStorage.getItem('senses_session');
    if(!raw) return false;
    const s = JSON.parse(raw);
    if(s && s.name){
      state.loggedIn = true;
      state.isAdmin = false; // never restore admin status, even if an old stale session had it
      state.form.name = s.name;
      return true;
    }
  } catch(e){}
  return false;
}
function toggleAdminLogin(){
  state.showAdminLogin = !state.showAdminLogin;
  state.adminPinInput = ''; state.adminPinError = false;
  render();
}
function attemptAdminLogin(){
  if(state.adminPinInput === MANAGER_PIN){
    state.loggedIn = true;
    state.isAdmin = true;
    state.tab = 'manager';
    state.form = emptyForm(); // admin has no therapist identity
    state.adminPinInput = ''; state.adminPinError = false;
    // Deliberately NOT calling saveSession() — admin access must require the PIN every time.
  } else {
    state.adminPinError = true; state.adminPinInput = '';
  }
  render();
}
function logout(){
  state.loggedIn = false; state.isAdmin = false; state.showAdminLogin = false;
  state.loginName = ''; state.loginPassword = ''; state.loginError = null;
  state.adminPinInput = ''; state.adminPinError = false;
  state.form = emptyForm(); // fully clear identity so nothing leaks into the next session
  state.tab = 'home';
  try { localStorage.removeItem('senses_session'); } catch(e){}
  render();
}
function currentUserLabel(){ return state.isAdmin ? 'Admin' : (state.form.name || 'Unknown'); }

// Shared by every export/print button that depends on a CDN-loaded library
// (XLSX, html2canvas, jsPDF). On a ship, wifi drops or is too slow for those
// scripts to have loaded — without this, clicking the button did nothing
// visible at all. Injected next to the button itself (not via state+render)
// so it survives without disturbing whatever's currently on screen.
function showExportError(btn, text){
  if(!btn || !btn.parentElement) return;
  let msg = btn.parentElement.querySelector('.export-error-msg');
  if(!msg){
    msg = document.createElement('div');
    msg.className = 'export-error-msg error-msg';
    msg.setAttribute('role','alert');
    msg.style.cssText = 'margin-top:8px; width:100%;';
    btn.parentElement.appendChild(msg);
  }
  msg.textContent = text;
}
function clearExportError(btn){
  const msg = btn && btn.parentElement && btn.parentElement.querySelector('.export-error-msg');
  if(msg) msg.remove();
}

function exportExcelByDay(btnId){
  const btn = document.getElementById(btnId || 'export-btn');
  clearExportError(btn);
  if(typeof XLSX === 'undefined'){
    showExportError(btn, "Couldn't build the Excel file — the export library didn't load. Check your connection and try again.");
    return;
  }
  try {
    // One sheet per cruise day, every roster therapist listed as a row (even
    // before they've submitted) so the workbook reads like a pre-built template
    // that just gets filled in as reports come in — same idea as the daily EOD
    // workbook, instead of one flat growing list of raw submissions.
    const headers = ['Name','Rebook #','Rebook $','Add On #','Add On $','XP #','XP $','Retail $','Guests','Total $','Pkgs','Touch','Submitted At','Service $'];
    const wb = XLSX.utils.book_new();

    // Cruise to Date first, so it's what's showing when the file opens — same
    // ranked-by-AIR leaderboard as the in-app "Cruise to Date" tab.
    const ctd = computeCruiseToDate();
    const ctdHeaders = ['#','Name','Role','Rebook #','Rebook $','Add On #','Add On $','XP #','XP $','Retail $','Guests','AIR CTD'];
    const ctdRanks = ctd.rows.map((r,i) => (i>0 && r.air === ctd.rows[i-1].air) ? null : i+1);
    for(let i=1;i<ctdRanks.length;i++){ if(ctdRanks[i]===null) ctdRanks[i]=ctdRanks[i-1]; }
    const ctdRows = ctd.rows.map((r,i) => [ctdRanks[i], r.name, r.position, r.rebookNum, r.rebookAmt, r.addonNum, r.addonAmt, r.xpNum, r.xpAmt, r.retailAmt, r.guests, Math.round(r.air*100)/100]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([ctdHeaders, ...ctdRows]), 'Cruise to Date');

    for(let day = 1; day <= state.voyageDays; day++){
      // Same Medi Spa/Acupuncture exclusion as the in-app per-day grid this
      // mirrors (see isItemizedXpCategory) — they're tracked separately from
      // the AIR tracker everywhere else in the app, this export shouldn't
      // be the one place that still lists them.
      const rows = state.roster.filter(n => !isItemizedXpCategory(n)).map(n => {
        const e = state.entries.find(x => x.cruiseDay === day && x.name === n);
        if(!e) return [n, '', '', '', '', '', '', '', '', '', '', '', '', ''];
        return [n, e.rebookNum, e.rebookAmt, e.addonNum, e.addonAmt, e.xpNum, e.xpAmt, e.retailAmt, e.guestsToday, entryTotal(e), e.packagesNum, e.touchPoints, e.submittedAt, e.serviceAmt];
      });
      const sheet = XLSX.utils.aoa_to_sheet([headers, ...rows]);
      XLSX.utils.book_append_sheet(wb, sheet, 'Day ' + day);
    }
    XLSX.writeFile(wb, 'senses-report-by-day-' + new Date().toISOString().slice(0,10) + '.xlsx');
  } catch(err){
    console.error(err);
    showExportError(btn, "Couldn't build the Excel file. Check your connection and try again.");
  }
}

/* ---------- render root ---------- */
function render(){
  const existingModal = document.querySelector('.lesson-modal-backdrop');
  if(existingModal) existingModal.remove();
  const existingPhotoViewer = document.querySelector('.lesson-photo-backdrop');
  if(existingPhotoViewer) existingPhotoViewer.remove();
  const existingShipLog = document.querySelector('.shiplog-backdrop');
  if(existingShipLog) existingShipLog.remove();
  const existingCelebrate = document.querySelector('.celebrate-backdrop');
  if(existingCelebrate) existingCelebrate.remove();
  const existingSubDetail = document.querySelector('.subdetail-modal-backdrop');
  if(existingSubDetail) existingSubDetail.remove();
  const root = document.getElementById('root');
  root.innerHTML = '';
  root.classList.toggle('admin-mode', !!(state.isAdmin && state.loggedIn && !state.loading && !state.loadError));

  if(!state.loading && !state.loadError && !state.loggedIn){
    root.appendChild(renderMasthead());
    const content = document.createElement('main'); content.className = 'content'; content.id = 'main-content';
    content.appendChild(renderLoginGate());
    root.appendChild(content);
    return;
  }

  root.appendChild(renderMasthead());
  const content = document.createElement('main'); content.className = 'content'; content.id = 'main-content';
  if(state.loading){ content.appendChild(renderSkeleton()); }
  else if(state.loadError){ const e = document.createElement('div'); e.className='error-msg'; e.setAttribute('role','alert'); e.textContent = state.loadError; content.appendChild(e); }
  else if(state.isAdmin){
    // Admin/manager identity never renders therapist-facing screens (submit, leaderboard,
    // history, hub, targets) — those require acting as a therapist, which admin must not do.
    content.appendChild(renderManagerTab());
  }
  else {
    // Newly-achieved targets get a one-time unlock celebration the next time this
    // therapist's screen renders — covers both a live submission crossing the goal
    // and a target that only became achievable once admin uploaded a sales recap.
    // Gated on the same "Hide Incentives from therapists" WIP toggle as the
    // Incentives tab itself (state.wipSections.targets) — a manager who's
    // hidden the tab because it's still being set up almost certainly doesn't
    // want the achievement popup firing either. Skipping the check here (not
    // just hiding the modal) also means an incentive earned while hidden still
    // gets its celebration the moment it's unhidden again, since it's only
    // ever marked "seen" inside checkTargetCelebrations itself.
    if(!state.wipSections.targets) checkTargetCelebrations(state.form.name);
    const wipLabels = { submit:'Submit', leaderboard:'Leaderboard', history:'History', hub:'Hub', targets:'Incentives' };
    if(['submit','leaderboard','history','hub','targets'].includes(state.tab) && state.wipSections[state.tab]){
      content.appendChild(renderWipPlaceholder(wipLabels[state.tab]));
    }
    else if(state.tab === 'submit') content.appendChild(renderSubmitTab());
    else if(state.tab === 'leaderboard') content.appendChild(renderLeaderboardTab());
    else if(state.tab === 'history') content.appendChild(renderHistoryTab());
    else if(state.tab === 'hub') content.appendChild(renderHubTab());
    else if(state.tab === 'targets') content.appendChild(renderTargetsTab());
    else content.appendChild(renderTherapistHome());
  }
  root.appendChild(content);
  if(!state.isAdmin) root.appendChild(renderBottomNav());
  if(state.openLessonModal){
    const modal = renderLessonModal();
    if(modal) document.body.appendChild(modal);
    if(state.lessonPhotoViewerOpen){
      const viewer = renderLessonPhotoViewer();
      if(viewer) document.body.appendChild(viewer);
    }
  }
  if(state.shipLogName){
    const shipModal = renderShipLogModal();
    if(shipModal) document.body.appendChild(shipModal);
  }
  if(state.targetCelebration && !state.isAdmin){
    document.body.appendChild(renderTargetCelebrationModal());
  }
  if(state.viewSubmissionId){
    const subModal = renderSubmissionDetailModal();
    if(subModal) document.body.appendChild(subModal);
  }
}

function renderLoginGate(){
  const frag = document.createDocumentFragment();
  // No shared PIN anymore — each name either already has its own 4-digit PIN
  // (set on a previous login, or after a manager reset clears it) or doesn't
  // yet, and the same field on this screen either checks it or creates it.
  const isNewPin = !!state.loginName && !state.staffPins[state.loginName];
  const panel = document.createElement('div'); panel.className = 'panel pin-gate';
  panel.innerHTML = `
    <svg class="pin-gate-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    <div class="pin-gate-title">Welcome back</div>
    <div class="pin-gate-sub">Search your name and enter your smart PIN to continue.</div>
    <div class="field name-combo" style="text-align:left;">
      <label for="login-name-search">Your name</label>
      <div class="name-search-wrap">
        <svg class="name-search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="login-name-search" class="name-search" autocomplete="off" placeholder="Tap to see everyone, or type your name…" value="${escapeHtml(state.loginName)}">
        <button type="button" class="name-search-clear ${state.loginName?'show':''}" id="login-name-clear" aria-label="Clear selected name">&times;</button>
      </div>
      <div class="name-dropdown" id="login-name-dropdown" role="listbox"></div>
    </div>
    ${state.loginName ? `
    <div class="field" style="text-align:left;">
      <label for="login-password">${isNewPin ? 'Create a 4-digit PIN' : 'Smart PIN'}</label>
      <input type="tel" inputmode="numeric" maxlength="4" id="login-password" placeholder="${isNewPin ? '••••' : 'Numbers only'}" value="${escapeHtml(state.loginPassword)}">

    ${isNewPin ? `<div style="font-size:10.5px; color:var(--ink-soft); margin-bottom:14px;">First time logging in — pick any 4 digits. You'll use this same PIN every time after today.</div>` : ''}
    ` : ''}
    ${state.loginError ? `<div class="error-msg">${escapeHtml(state.loginError)}</div>` : ''}
    <button class="pin-submit" id="login-btn" ${state.loginSaving?'disabled':''}>${state.loginSaving ? 'Saving…' : (isNewPin ? 'Create PIN & continue' : 'Continue')}</button>
    <div style="margin-top:16px;">
      <button class="admin-login-link" id="admin-toggle">${state.showAdminLogin ? 'Hide admin login' : 'Admin login'}</button>
    </div>
    ${state.showAdminLogin ? `
      <div class="admin-login-box">
        <input type="tel" inputmode="numeric" maxlength="4" class="pin-input" id="admin-pin-input" placeholder="••••" value="${escapeHtml(state.adminPinInput)}">
        ${state.adminPinError ? `<div class="error-msg" style="max-width:220px;margin:10px auto 0;">Incorrect PIN.</div>` : ''}
        <button class="pin-submit" id="admin-pin-submit" style="margin-top:12px;">Log in as admin</button>
      </div>
    ` : ''}
  `;
  frag.appendChild(panel);
  setTimeout(() => {
    const search = document.getElementById('login-name-search');
    const dropdown = document.getElementById('login-name-dropdown');
    const clearBtn = document.getElementById('login-name-clear');
    function pickName(n){
      state.loginName = n; state.loginPassword = ''; state.loginError = null; render();
    }
    function renderDropdown(query){
      const matches = state.roster.filter(n => n.toLowerCase().includes(query.toLowerCase()));
      if(matches.length === 0){
        dropdown.innerHTML = `<div class="name-empty">No one matches "${escapeHtml(query)}"</div>`;
        return;
      }
      dropdown.innerHTML = matches.map(n =>
        `<div class="name-option" data-name="${escapeHtml(n)}" role="option"><span class="name-option-avatar" style="background:${avatarGradient(n)};">${initials(n)}</span><span class="name-option-text">${highlightNameMatch(n, query)}</span></div>`
      ).join('');
      dropdown.querySelectorAll('.name-option').forEach(el => {
        el.onmousedown = (e) => { e.preventDefault(); pickName(el.dataset.name); };
      });
    }
    function openDropdown(){ renderDropdown(search.value); dropdown.classList.add('open'); }
    function closeDropdown(){ dropdown.classList.remove('open'); }
    if(search){
      search.addEventListener('focus', openDropdown);
      search.addEventListener('input', () => {
        if(state.loginName && search.value !== state.loginName){ state.loginName = ''; clearBtn.classList.remove('show'); }
        openDropdown();
      });
      search.addEventListener('keydown', e => {
        if(e.key === 'Enter'){
          e.preventDefault();
          const matches = state.roster.filter(n => n.toLowerCase().includes(search.value.toLowerCase()));
          if(!state.loginName && matches.length === 1){ pickName(matches[0]); }
          else if(state.loginName){ attemptLogin(); }
        }
      });
    }
    if(clearBtn) clearBtn.onclick = () => { pickName(''); };
    const pw = document.getElementById('login-password');
    if(pw){
      pw.focus();
      pw.oninput = e => { state.loginPassword = e.target.value.replace(/\D/g,'').slice(0,4); pw.value = state.loginPassword; };
      pw.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); attemptLogin(); } };
    }
    const btn = document.getElementById('login-btn'); if(btn) btn.onclick = attemptLogin;
    const adminToggle = document.getElementById('admin-toggle'); if(adminToggle) adminToggle.onclick = toggleAdminLogin;
    const adminPin = document.getElementById('admin-pin-input');
    if(adminPin){
      adminPin.focus();
      adminPin.oninput = e => { state.adminPinInput = e.target.value.replace(/\D/g,'').slice(0,4); state.adminPinError=false; };
      adminPin.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); attemptAdminLogin(); } };
    }
    const adminBtn = document.getElementById('admin-pin-submit'); if(adminBtn) adminBtn.onclick = attemptAdminLogin;
  }, 0);
  return frag;
}

/* ---------- therapist home ---------- */
function renderTherapistHome(){
  const frag = document.createDocumentFragment();
  const myName = state.form.name;

  if(!myName){
    const p = document.createElement('div'); p.className='panel';
    p.innerHTML = `<div class="empty-state">Select your name on the Submit tab first — your home screen shows up here once you have.</div>`;
    frag.appendChild(p); return frag;
  }

  // "Today" here MUST be the real, calendar-based cruise day (Settings > Cruise
  // start date), same as the Submit tab uses to auto-select a day and auto-flag
  // late entries — never derived from what's been submitted so far. It used to be
  // the highest cruiseDay across EVERYONE's entries, which meant a single stray
  // or backfilled entry for a later day (even someone else's) made this therapist's
  // whole home screen — day header, Revenue Today, days-left math — jump ahead,
  // even with zero submissions of their own. Only fall back to that old
  // submitted-entries heuristic when no cruise start date is configured at all.
  const allDays = state.entries.map(e => e.cruiseDay);
  const today = computeCurrentCruiseDay() || (allDays.length > 0 ? Math.max(...allDays) : 1);
  const mine = state.entries.filter(e => e.name === myName);

  const todaysMine = mine.filter(e => e.cruiseDay === today);
  // Revenue Today/Yesterday feed the AIR trend badge below — late entries
  // are excluded from this comparison, same as every other AIR number.
  const revenueToday = todaysMine.filter(isAirsEligible).reduce((s,e) => s + entryTotal(e), 0);
  const yestMine = mine.filter(e => e.cruiseDay === today - 1);
  const revenueYest = yestMine.filter(isAirsEligible).reduce((s,e) => s + entryTotal(e), 0);
  const delta = revenueYest > 0 ? Math.round(((revenueToday - revenueYest) / revenueYest) * 100) : null;

  const daysSubmitted = new Set(mine.map(e => e.cruiseDay)).size;
  const submittedToday = todaysMine.length > 0;
  const pct = state.voyageDays > 0 ? Math.round((daysSubmitted / state.voyageDays) * 100) : 0;

  const totalRetail = computeStaffCumulative(myName, 'retailSales');
  const airsRankInfo = computeAirsRank(myName);
  const airsRankFill = airsRankInfo.rank && airsRankInfo.of > 0 ? Math.round(((airsRankInfo.of - airsRankInfo.rank + 1) / airsRankInfo.of) * 100) : 0;
  // Total AIR = same AIR formula as everywhere else, cumulative across every
  // ON-TIME day submitted this voyage (not just today) — matches the
  // History tab's hero number. Late entries are excluded (see
  // isAirsEligible) so a backfilled day never moves this or Board Position.
  const mineAirs = mine.filter(isAirsEligible);
  const totalAllRevenue = mineAirs.reduce((s,e) => s + entryTotal(e), 0);
  const totalAllGuests = mineAirs.reduce((s,e) => s + num(e.guestsToday), 0);
  const airsAll = totalAllGuests > 0 ? totalAllRevenue / totalAllGuests : 0;

  let attention = null;
  if(state.targets.length > 0 && state.voyageDays > 0){
    const pace = Math.min(100, (today / state.voyageDays) * 100);
    state.targets.forEach(t => {
      const { pct: tpct } = computeTargetProgress(t, { name: myName, includeDraft:false });
      const behind = Math.round(pace - tpct);
      if(behind > 10 && (!attention || behind > attention.behind)) attention = { name: t.name, behind };
    });
  }
  const daysLeft = Math.max(0, state.voyageDays - today);

  // New Targets system: total-$ progress + retail-rate squares below (see
  // therapistGoalBreakdown / actualRetailPct). goal is null when this
  // therapist's category or total target isn't configured yet — the manager
  // gets the same gap flagged in Manager > Targets (goalConfigGaps).
  const goal = therapistGoalBreakdown(myName);
  const goalAchieved = cumulativeRetailAmt(myName) + cumulativeServiceAmt(myName);
  const goalMissing = goal ? Math.max(0, goal.total - goalAchieved) : null;
  const retailPctActual = actualRetailPct(myName);
  const retailBenchmark = goal ? goal.retailPct : categoryRetailPct(therapistCategory(myName));
  const guestsThisVoyage = cumulativeGuestsThisVoyage(myName);
  const avgRetailPerGuest = guestsThisVoyage > 0 ? cumulativeRetailAmt(myName) / guestsThisVoyage : 0;
  const avgServicePerGuest = guestsThisVoyage > 0 ? cumulativeServiceAmt(myName) / guestsThisVoyage : 0;

  const head = document.createElement('div'); head.className='head-row';
  head.innerHTML = `<div class="head-left"><div class="mh-avatar">${initials(myName)}</div><div><div class="greet-title">Hey! ${escapeHtml(myName.split(' ')[0])} &#128075;</div><div class="greet-sub">Senses Report &middot; Day ${today} of ${state.voyageDays}</div></div></div>`;
  frag.appendChild(head);

  // Level 1: cumulative AIR and leaderboard position side by side — the two
  // headline numbers that matter at a glance (Revenue Today dropped per
  // request).
  const stat = document.createElement('div'); stat.className='stat-card';
  stat.innerHTML = `
    <div style="display:flex; gap:8px;">
      <div style="flex:1; min-width:0;">
        <div class="stat-label" style="font-size:10.5px;">Total AIR</div>
        <div class="stat-val" style="font-size:21px;">${fmtMoney(airsAll)}</div>
      </div>
      <div style="flex:1; min-width:0;">
        <div class="stat-label" style="font-size:10.5px;">Board Position</div>
        <div class="stat-val" style="font-size:21px;">${airsRankInfo.rank ? '#'+airsRankInfo.rank : '—'}</div>
      </div>
    </div>
    ${delta !== null ? `<div class="stat-delta" style="${delta<0?'color:var(--coral);background:rgba(var(--coral-rgb),0.12);':''}">${delta>=0?'&#9650;':'&#9660;'} ${Math.abs(delta)}% from Day ${today-1}</div>` : ''}
  `;
  frag.appendChild(stat);

  // Level 2: cruise target (this voyage's combined $ progress) with the
  // %-of-retail indicator folded into the same square, sized like Level 3.
  // Total Retail (formerly its own mini-card) now sits right under the
  // %-retail badge here instead.
  const goalPct = goal && goal.total > 0 ? Math.min(100, (goalAchieved / goal.total) * 100) : 0;
  const retailPctKnown = retailPctActual !== null && retailBenchmark !== null;
  const goalCard = document.createElement('div'); goalCard.className='sub-card';
  goalCard.innerHTML = `
    <div class="sub-top">
      <div class="sub-label">Cruise Target</div>
      <div style="text-align:right;">
        <div class="sub-pct" style="${retailPctKnown ? (retailPctActual>=retailBenchmark?'color:var(--success);':'color:var(--coral);') : 'color:var(--ink-faint);font-size:12px;'}">${retailPctKnown ? Math.round(retailPctActual)+'% retail' : 'Not set'}</div>
        <div style="font-size:10px;color:var(--ink-faint);font-weight:700;margin-top:2px;">${fmtMoney(totalRetail)} retail total</div>
      </div>
    </div>
    ${goal ? `
      <div class="sub-val">${fmtMoney(goalAchieved)} <span style="font-size:14px;color:var(--ink-faint);font-weight:700;">/ ${fmtMoney(goal.total)}</span></div>
      <div class="sub-cap">${fmtMoney(goalMissing)} to go &middot; goal ${Math.round(goal.retailPct)}% retail</div>
      <div class="mh-track"><div class="mh-fill" data-w="${goalPct}" style="width:0%; background:linear-gradient(90deg,var(--blue) 0%,#8FA6FF 100%); box-shadow:0 0 14px rgba(var(--blue-rgb),0.55);"></div></div>
    ` : `
      <div class="sub-val" style="font-size:16px;color:var(--ink-faint);">Not set yet</div>
      <div class="sub-cap">Ask your manager to set your target</div>
    `}
  `;
  frag.appendChild(goalCard);

  // Avg per Guest + Revenue/Day Missing, now positioned above the
  // submissions square instead of below it. Revenue/Day Missing = $ still
  // needed to hit the cruise target, spread over the cruise days remaining.
  const revenuePerDayMissing = goal && daysLeft > 0 ? goalMissing / daysLeft : null;
  const two = document.createElement('div'); two.className='two-col';
  two.innerHTML = `
    <div class="mini-card">
      <div class="mini-label">Avg per Guest</div>
      <div class="mini-sub">This voyage</div>
      <div class="mini-val" style="font-size:15px;margin-top:8px;">${fmtMoney(avgRetailPerGuest)} <span style="font-size:9px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;">retail</span></div>
      <div class="mini-val" style="font-size:15px;margin-top:5px;">${fmtMoney(avgServicePerGuest)} <span style="font-size:9px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;">service</span></div>
    </div>
    <div class="mini-card">
      <div class="mini-label">Revenue/Day Missing</div>
      <div class="mini-sub">${daysLeft > 0 ? `${daysLeft} day${daysLeft===1?'':'s'} left` : 'Voyage ending'}</div>
      <div class="mini-val">${revenuePerDayMissing !== null ? fmtMoney(revenuePerDayMissing) : '—'}</div>
    </div>
  `;
  frag.appendChild(two);

  // Level 3: your submissions, with the submit CTA folded into the same
  // square instead of sitting as a separate button below.
  const sub = document.createElement('div'); sub.className='sub-card'; sub.style.cursor='pointer';
  sub.innerHTML = `
    <div class="sub-top"><div class="sub-label">Your submissions</div><div class="sub-pct" style="${submittedToday?'':'color:var(--gold);'}">${submittedToday?'&#10003; Submitted':'Not yet'}</div></div>
    <div class="sub-val">${daysSubmitted}/${state.voyageDays} <span style="font-size:12px;color:var(--ink-faint);font-weight:700;">days</span></div>
    <div class="sub-cap">Day ${today} of ${state.voyageDays}</div>
    <div class="mh-track"><div class="mh-fill" data-w="${pct}" style="width:0%;"></div></div>
    <button type="button" class="submit-btn" id="home-submit-btn" style="margin-top:16px;">Submit daily report</button>
  `;
  sub.onclick = (e) => { if(e.target.id !== 'home-submit-btn') setTab('submit'); };
  frag.appendChild(sub);
  setTimeout(() => { const b = document.getElementById('home-submit-btn'); if(b) b.onclick = (e) => { e.stopPropagation(); setTab('submit'); }; }, 0);

  if(attention){
    const attn = document.createElement('div'); attn.className='attn-card';
    attn.innerHTML = `<div class="attn-title">&#9888; Needs attention</div><div class="attn-text">"${escapeHtml(attention.name)}" incentive is ${attention.behind}% behind pace${daysLeft>0?` &mdash; ${daysLeft} day${daysLeft===1?'':'s'} left`:''}.</div>`;
    frag.appendChild(attn);
  }

  setTimeout(animateProgressBars, 0);
  return frag;
}

/* ---------- submit tab ---------- */
function renderSubmitTab(){
  const frag = document.createDocumentFragment();
  if(state.roster.length === 0){
    const w = document.createElement('div'); w.className='error-msg';
    w.textContent = 'No team roster yet. Go to the Manager tab to add names before staff can submit.';
    frag.appendChild(w); return frag;
  }
  if(state.submitConfirm) return renderConfirmScreen();
  // "Close submissions" no longer blocks the form — staff stay able to
  // submit normally the whole time. It just means anything logged while
  // it's on comes in marked Late (same treatment as a day that's already
  // passed) — the banner below the day-picker says so.

  const f = state.form;
  // The name is fixed to whoever authenticated on the login screen — this
  // form used to let anyone repick a name from the roster here with no PIN
  // check at all, which silently defeated the whole point of per-person PINs
  // (anyone at the tile could submit as someone else). Locked to state.loginName.
  f.name = state.loginName;
  if(!f.cruiseDay){
    const auto = computeCurrentCruiseDay();
    if(auto) f.cruiseDay = String(auto);
  }
  // Medi Spa / Acupuncture: itemized cross-promotion rows instead of the
  // standard Rebooking/Add-on/XP tiles — see isItemizedXpCategory. Always
  // keep at least one (possibly blank) row showing so there's somewhere to
  // start typing.
  const itemized = isItemizedXpCategory(f.name);
  if(itemized && (!f.xpBreakdown || f.xpBreakdown.length === 0)) f.xpBreakdown = [{ name:'', guests:'', amount:'' }];
  const validXpRowsLive = itemized
    ? (f.xpBreakdown || []).filter(r => r.name && state.roster.includes(r.name) && num(r.amount) > 0)
    : [];
  const liveXpAmt = itemized
    ? validXpRowsLive.reduce((s,r) => s + num(r.amount), 0)
    : num(f.xpAmt);
  const panel = document.createElement('div'); panel.className = 'panel';
  // Non-itemized only: the Cross promotion (XP) department split must be
  // confirmed and balanced before Submit is allowed — see
  // computeXpSplitGate. Itemized (Medi Spa/Acupuncture) reports don't use
  // xpNum/xpAmt/xpDeptRows at all, so the gate is always satisfied for them.
  const xpGate = itemized ? { valid:true } : computeXpSplitGate(f);
  const total = (itemized ? 0 : num(f.rebookAmt)+num(f.addonAmt)) + liveXpAmt + num(f.retailAmt);
  // Itemized category: no standalone Guests tile anymore — the day's guest
  // count is the sum of each valid XP row's guests (blank row defaults to
  // 1). Must match xpBreakdownSectionHTML/refreshXpDayTotals/submitEntry.
  const guests = itemized
    ? validXpRowsLive.reduce((s,r) => s + (num(r.guests) > 0 ? num(r.guests) : 1), 0)
    : num(f.guestsToday);
  const airs = guests > 0 ? total / guests : 0;
  const submittedDays = new Set(state.entries.filter(e => e.name === f.name).map(e => e.cruiseDay));
  const selectedDayNum = f.cruiseDay ? num(f.cruiseDay) : null;
  // Days before today's cruise day (when the cruise start date is set, so
  // "today" is actually known) that never got a report are flagged as Late
  // — still submittable (finished a massage late, forgot, was out sick),
  // just marked so it won't move AIR/leaderboard. Only meaningful once a
  // cruise start date is configured; without one nothing is treated as late.
  const todayCruiseDay = computeCurrentCruiseDay();
  const missedDays = new Set(
    todayCruiseDay
      ? Array.from({length: state.voyageDays}, (_,i) => i+1).filter(d => d < todayCruiseDay && !submittedDays.has(d))
      : []
  );
  // Once a report is in for a given name+day, that day is locked on the staff
  // side — no silent resubmits that either get ignored (day view/export only
  // show the first entry) or double-counted (Cruise to Date sums every entry).
  // If a number needs correcting, a manager does it from Reports > Day.
  const locked = !!(f.name && selectedDayNum && submittedDays.has(selectedDayNum));

      ${itemized ? '' : tileHTML('serviceAmt','Service','<path d="M12 3c-4 0-6 3-6 7 0 2.5-.8 3.5-1.7 4.3A1 1 0 0 0 5 16h14a1 1 0 0 0 .7-1.7C18.8 13.5 18 12.5 18 10c0-4-2-7-6-7Z"/><path d="M10 20a2 2 0 0 0 4 0"/>', true)}

      const el = document.getElementById('f-'+id);
      if(!el) return;
      const handler = ev => {
        state.form[id] = ev.target.value;
        if(itemized){
          // The itemized category no longer renders xpNum/xpAmt/rebook/addon/
          // guestsToday/serviceAmt tiles at all (guests now lives per-XP-row
          // — see xpBreakdownSectionHTML), so this only ever fires for
          // retailAmt here — route it through the same total logic the XP
          // rows use.
          if(id === 'retailAmt') refreshXpDayTotals();
        } else if(['rebookAmt','addonAmt','xpAmt','retailAmt','guestsToday'].includes(id)){
          const t = num(state.form.rebookAmt)+num(state.form.addonAmt)+num(state.form.xpAmt)+num(state.form.retailAmt);
          const g = num(state.form.guestsToday);
          const a = g > 0 ? t / g : 0;
          const btn = document.getElementById('submit-btn'); if(btn && !state.submitting) btn.textContent = 'Submit report — AIR ' + fmtMoney(a);
        }
        if(!itemized && (id === 'xpNum' || id === 'xpAmt')){
          // Count/Amount are only ever editable pre-confirm (they're disabled
          // once the split is open), so this only recomputes whether Submit
          // should still be blocked on "confirm your split" — it never fights
          // refreshXpSplitUI's own gate check after confirmation.
          const btn = document.getElementById('submit-btn'); if(btn && !state.submitting) btn.disabled = !computeXpSplitGate(state.form).valid;
        }
        updateTargetsUI();
      };
      el.oninput = handler;
      if(el.tagName === 'SELECT') el.onchange = handler;
    });
    if(itemized) wireXpBreakdownRows();
    else {
      wireXpSplitSection();
      const xpConfirmBtn = document.getElementById('xp-confirm-btn'); if(xpConfirmBtn) xpConfirmBtn.onclick = confirmXpSplit;
      const xpEditTotalsLink = document.getElementById('xp-edit-totals'); if(xpEditTotalsLink) xpEditTotalsLink.onclick = editXpTotals;
    }
    document.querySelectorAll('.day-block').forEach(b => { b.onclick = () => { if(b.disabled) return; setCruiseDay(b.dataset.day); }; });
    const submitBtn = document.getElementById('submit-btn'); if(submitBtn) submitBtn.onclick = submitEntry;
    const notYouBtn = document.getElementById('not-you-btn'); if(notYouBtn) notYouBtn.onclick = logout;
  }, 0);

  return frag;
}
function targetsSectionHTML(){

          return `<div class="target-card" id="target-row-${t.id}">

function updateTargetsUI(){
  if(!state.form.name) return;
  state.targets.forEach(t => {
    const { value, pct, achieved } = computeTargetProgress(t);
    const fill = document.getElementById('target-fill-'+t.id);
    if(fill){ fill.style.width = pct + '%'; fill.classList.toggle('done', achieved); }
    const reward = document.getElementById('target-reward-'+t.id);
    if(reward){
      reward.classList.toggle('earned', achieved);
      reward.innerHTML = achieved ? '&#127881; Earned' : '&#127873; '+escapeHtml(t.reward || 'Reward TBD');
    }
    const count = document.getElementById('target-count-'+t.id);
    if(count){ count.textContent = fmtTargetValue(value,t.metric) + ' / ' + fmtTargetValue(t.value,t.metric); }
  });
}
function tileHTML(id, label, iconPath, isMoney, disabled){
  const val = state.form[id] || '';
  return `<div class="tile ${isMoney?'money':''}"><div class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconPath}</svg></div>
    <div class="tile-text"><div class="tile-label">${label}</div><input type="number" inputmode="${isMoney?'decimal':'numeric'}" min="0" ${isMoney?'step="0.01"':''} id="f-${id}" class="tile-input" value="${val}" placeholder="0" aria-label="${label}" ${disabled?'disabled':''}></div></div>`;
}
// Standard (non-itemized) Cross promotion (XP): a department split is only
// required once Count or Amount is non-zero, and only becomes valid once
// the therapist has confirmed it (see confirmXpSplit) with every row
// assigned a department and the row amounts summing exactly to the target
// Amount. Shared by renderSubmitTab's initial disabled state and the live
// oninput refresh in its setTimeout wiring — see refreshXpSplitUI.
function computeXpSplitGate(f){
  const targetAmt = num(f.xpAmt);
  const targetCount = num(f.xpNum);
  const needsSplit = targetAmt > 0 || targetCount > 0;
  if(!needsSplit) return { needsSplit:false, valid:true, remaining:0 };
  if(!f.xpConfirmed) return { needsSplit:true, valid:false, remaining:targetAmt };
  const rows = f.xpDeptRows || [];
  const sum = rows.reduce((s,r) => s + num(r.amount), 0);
  const remaining = targetAmt - sum;
  const allDeptsPicked = rows.length > 0 && rows.every(r => r.dept);
  return { needsSplit:true, valid: remaining === 0 && allDeptsPicked, remaining };
}
function xpSplitRowHTML(row, i, rowCount){
  return `
    <div class="xp-split-row" data-idx="${i}">
      <div class="dept-pills">
        ${XP_DEPTS.map(d => `<button type="button" class="dept-pill ${row.dept===d.key?'sel':''} ${d.key==='fitness'?'dept-pill-wide':''}" data-dept="${d.key}" data-idx="${i}">${escapeHtml(d.label)}</button>`).join('')}
      </div>
      <div class="row-fields">
        <div class="split-input-wrap"><span class="split-dollar">$</span><input type="number" inputmode="decimal" class="split-input xp-split-amount" data-idx="${i}" value="${row.amount}" placeholder="0" aria-label="Department amount"></div>
        <button type="button" class="row-remove xp-split-remove" data-idx="${i}" aria-label="Remove row" ${rowCount<=1?'disabled':''}>&times;</button>
      </div>
    </div>`;
}
function xpSplitSectionHTML(f){
  const rows = f.xpDeptRows || [];
  const targetAmt = num(f.xpAmt);
  const sum = rows.reduce((s,r) => s + num(r.amount), 0);
  const remaining = targetAmt - sum;
  const balCls = remaining === 0 ? 'ok' : (remaining < 0 ? 'over' : '');
  return `
    <div class="split-panel ${f.xpConfirmed?'show':''}" id="xp-split-panel">
      <div class="split-panel-inner">
        <div class="xp-hint-line">Assigning ${rows.length} XP &middot; ${fmtMoney(targetAmt)} by department</div>
        <div id="xp-split-rows">${rows.map((r,i) => xpSplitRowHTML(r,i,rows.length)).join('')}</div>
        <button type="button" class="add-row-btn" id="xp-split-add-row">+ Add another department</button>
        <div class="breakdown-total" id="xp-split-total">${rows.length} XP &middot; ${fmtMoney(sum)}</div>
        <div class="balance-row ${balCls}" data-xp-balance style="margin-top:10px;"><span class="balance-label">Remaining to assign</span><span class="balance-val" data-xp-balance-val>${remaining<0?'-'+fmtMoney(Math.abs(remaining)):fmtMoney(remaining)}</span></div>
      </div>
    </div>`;
}
function confirmXpSplit(){
  const f = state.form;
  const count = Math.max(1, Math.round(num(f.xpNum)) || 1);
  const total = num(f.xpAmt);
  const base = Math.floor(total / count);
  const rows = [];
  for(let i=0;i<count;i++){
    rows.push({ dept:'', amount: (i === count-1) ? (total - base*(count-1)) : base });
  }
  f.xpDeptRows = rows;
  f.xpConfirmed = true;
  f.xpNum = String(count);
  render();
}
function editXpTotals(){
  const f = state.form;
  f.xpConfirmed = false;
  f.xpDeptRows = [];
  render();
}
function addXpSplitRow(){
  const f = state.form;
  f.xpDeptRows = f.xpDeptRows || [];
  f.xpDeptRows.push({ dept:'', amount:0 });
  f.xpNum = String(f.xpDeptRows.length);
  render();
}
function removeXpSplitRow(idx){
  const f = state.form;
  if(!f.xpDeptRows || f.xpDeptRows.length <= 1) return;
  f.xpDeptRows.splice(idx,1);
  f.xpNum = String(f.xpDeptRows.length);
  render();
}
function pickXpSplitDept(idx, dept){
  const f = state.form;
  if(!f.xpDeptRows || !f.xpDeptRows[idx]) return;
  f.xpDeptRows[idx].dept = dept;
  render();
}
// Live-refreshes the split total/balance/submit-gate as a row amount is
// typed, without a full render() — same reasoning as refreshXpDayTotals:
// re-rendering on every keystroke would fight the input's own cursor/focus.
function refreshXpSplitUI(){
  const f = state.form;
  const rows = f.xpDeptRows || [];
  const targetAmt = num(f.xpAmt);
  const sum = rows.reduce((s,r) => s + num(r.amount), 0);
  const remaining = targetAmt - sum;
  const totalEl = document.getElementById('xp-split-total');
  if(totalEl) totalEl.textContent = `${rows.length} XP · ${fmtMoney(sum)}`;
  const balRow = document.querySelector('[data-xp-balance]');
  const balVal = document.querySelector('[data-xp-balance-val]');
  if(balVal) balVal.textContent = remaining < 0 ? '-' + fmtMoney(Math.abs(remaining)) : fmtMoney(remaining);
  if(balRow){ balRow.classList.remove('ok','over'); if(remaining===0) balRow.classList.add('ok'); else if(remaining<0) balRow.classList.add('over'); }
  const btn = document.getElementById('submit-btn');
  if(btn && !state.submitting) btn.disabled = !computeXpSplitGate(f).valid;
}
function wireXpSplitSection(){
  const wrap = document.getElementById('xp-split-rows');
  if(!wrap) return;
  const f = state.form;
  wrap.querySelectorAll('.xp-split-amount').forEach(el => {
    el.oninput = ev => { f.xpDeptRows[Number(el.dataset.idx)].amount = ev.target.value; refreshXpSplitUI(); };
  });
  wrap.querySelectorAll('.dept-pill').forEach(pill => {
    pill.onclick = () => pickXpSplitDept(Number(pill.dataset.idx), pill.dataset.dept);
  });
  wrap.querySelectorAll('.xp-split-remove').forEach(btn => {
    btn.onclick = () => removeXpSplitRow(Number(btn.dataset.idx));
  });
  const addBtn = document.getElementById('xp-split-add-row');
  if(addBtn) addBtn.onclick = addXpSplitRow;
}

      </div>
    </div>`).join('');
  const validRows = rows.filter(r => r.name && state.roster.includes(r.name) && num(r.amount) > 0);
  const xpTotal = validRows.reduce((s,r) => s + num(r.amount), 0);
  // A blank Guests field on an otherwise-valid row defaults to 1 — lets a
  // therapist skip the field entirely for the common "just one guest" case.
  const guestTotal = validRows.reduce((s,r) => s + (num(r.guests) > 0 ? num(r.guests) : 1), 0);
  return `

// Wires up every interactive piece of xpBreakdownSectionHTML — the per-row
// name-search combo (typeahead + dropdown, mirroring renderLoginGate's),
// the amount input, the remove button, and the "+ Add another" button.
// Called from renderSubmitTab's setTimeout, same pattern as the rest of
// that form's wiring.
// Shared by wireXpBreakdownRows and the Retail/Guests tile handlers below
// (both can change the day's total for the itemized category) — keeps the
// per-category "X XP · $Y" line, the "Total for the day" line, and the
// submit button's live AIR figure all in sync without a full render().
function refreshXpDayTotals(){
  const f = state.form;
  const valid = (f.xpBreakdown || []).filter(r => r.name && state.roster.includes(r.name) && num(r.amount) > 0);
  const xpAmt = valid.reduce((s,r) => s + num(r.amount), 0);
  // Guests is no longer a standalone tile for this category — it's derived
  // by summing each valid row's guest count (a blank field defaults to 1).
  // Must match xpBreakdownSectionHTML's guestTotal and submitEntry's
  // itemizedGuestTotal exactly, or the live AIR figure shown here would
  // disagree with what actually gets saved.
  const guestTotal = valid.reduce((s,r) => s + (num(r.guests) > 0 ? num(r.guests) : 1), 0);
  const totalLabel = document.querySelector('.xp-breakdown-total');
  if(totalLabel) totalLabel.innerHTML = `${valid.length} referrer${valid.length===1?'':'s'} &middot; ${guestTotal} guest${guestTotal===1?'':'s'} &middot; ${fmtMoney(xpAmt)}`;
  const dayTotal = xpAmt + num(f.retailAmt);
  const dayTotalEl = document.getElementById('xp-day-total');
  if(dayTotalEl) dayTotalEl.innerHTML = `Total for the day: <strong style="color:var(--ink);">${fmtMoney(dayTotal)}</strong>`;
  const air = guestTotal > 0 ? dayTotal / guestTotal : 0;
