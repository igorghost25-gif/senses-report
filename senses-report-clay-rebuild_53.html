  }
  frag.appendChild(listPanel);
  setTimeout(() => {
    document.querySelectorAll('.rule-del').forEach(b => b.onclick = () => deleteRule(b.dataset.id));
    document.querySelectorAll('.rule-edit-link').forEach(b => b.onclick = () => startEditRule(b.dataset.id));
  }, 0);

  const sec = document.createElement('div'); sec.className='section'; sec.textContent = state.editingRuleId ? 'Edit rule' : 'New rule'; frag.appendChild(sec);
  const np = document.createElement('div'); np.className='new-rule-card';
  const nr = state.newRule;
  np.innerHTML = `
    ${state.ruleMsg ? `<div class="${state.ruleMsg.type==='error'?'error-msg':'confirm-msg'}">${escapeHtml(state.ruleMsg.text)}</div>` : ''}
    <div class="form-row"><div class="form-label">Metric</div><select class="form-select" id="rule-metric">${METRICS.map(m=>`<option value="${m.key}" ${nr.metric===m.key?'selected':''}>${m.label}</option>`).join('')}</select></div>
    <div class="form-row"><div class="form-label">Condition</div><select class="form-select" id="rule-op"><option value="lt" ${nr.op==='lt'?'selected':''}>is less than</option><option value="gt" ${nr.op==='gt'?'selected':''}>is greater than</option></select></div>
    <div class="form-row"><div class="form-label">Value</div><input type="number" class="form-input" id="rule-value" value="${nr.value}" placeholder="e.g. 2"></div>
    <div class="form-row"><div class="form-label">Comment to show</div><textarea class="form-textarea" id="rule-comment" placeholder="What should staff see?">${escapeHtml(nr.comment)}</textarea></div>
    <div style="display:flex; gap:8px;">
      ${state.editingRuleId ? `<button class="save-rule-btn" id="rule-cancel" style="background:var(--neo-base); color:var(--ink); box-shadow:4px 4px 8px var(--neo-dark), -4px -4px 8px var(--neo-light);">Cancel</button>` : ''}
      <button class="save-rule-btn" id="rule-save">${state.editingRuleId ? 'Save changes' : 'Save rule'}</button>
    </div>
  `;
  frag.appendChild(np);
  setTimeout(() => {
    document.getElementById('rule-metric').onchange = e => state.newRule.metric = e.target.value;
    document.getElementById('rule-op').onchange = e => state.newRule.op = e.target.value;
    document.getElementById('rule-value').oninput = e => state.newRule.value = e.target.value;
    document.getElementById('rule-comment').oninput = e => state.newRule.comment = e.target.value;
    document.getElementById('rule-save').onclick = saveNewRule;
    const cancelBtn = document.getElementById('rule-cancel'); if(cancelBtn) cancelBtn.onclick = cancelEditRule;
  }, 0);
  return frag;
}

function renderTargetsSub(){
  const frag = document.createDocumentFragment();
  const listPanel = document.createElement('div'); listPanel.className='panel';
  if(state.targets.length===0){ listPanel.innerHTML = `<div class="empty-state">No incentives yet — add one below.</div>`; }
  else {
    listPanel.innerHTML = state.targets.map(t => `<div class="rule-card">
      <button class="target-del" data-id="${t.id}" aria-label="Delete incentive" style="float:right;border:none;background:none;color:var(--coral);font-weight:700;cursor:pointer;font-size:13px;">&times;</button>
      <div class="rule-cond"><span class="rule-pill">${escapeHtml(t.name)}</span><span class="rule-pill op">${escapeHtml(targetMetricLabel(t.metric))}</span><span class="rule-pill">${t.value}</span></div>
      <div class="rule-comment">Reward: <b>${t.reward ? escapeHtml(t.reward) : '—'}</b>${t.resetVersion ? ` &middot; <span style="color:var(--ink-faint);">reset ${t.resetVersion}&times;</span>` : ''}</div>
      <div style="display:flex; gap:14px; margin-top:8px;">
        <button class="target-edit-link" data-id="${t.id}" style="border:none;background:none;color:var(--blue);font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline;padding:0;">Edit this incentive</button>
        <button class="target-reset-link" data-id="${t.id}" title="Starts this incentive back at 0 for everyone — doesn't touch daily numbers or delete the incentive" style="border:none;background:none;color:var(--gold);font-size:11px;font-weight:700;cursor:pointer;text-decoration:underline;padding:0;">Reset progress</button>
      </div>
    </div>`).join('');
  }
  frag.appendChild(listPanel);
  setTimeout(() => {
    document.querySelectorAll('.target-del').forEach(b => b.onclick = () => deleteTarget(b.dataset.id));
    document.querySelectorAll('.target-edit-link').forEach(b => b.onclick = () => startEditTarget(b.dataset.id));
    document.querySelectorAll('.target-reset-link').forEach(b => b.onclick = () => resetTargetProgress(b.dataset.id));
  }, 0);

  const sec = document.createElement('div'); sec.className='section'; sec.textContent = state.editingTargetId ? 'Edit incentive' : 'New incentive'; frag.appendChild(sec);
  const np = document.createElement('div'); np.className='new-rule-card';
  const nt = state.newTarget;
  np.innerHTML = `
    ${state.targetMsg ? `<div class="${state.targetMsg.type==='error'?'error-msg':'confirm-msg'}">${escapeHtml(state.targetMsg.text)}</div>` : ''}
    <div class="form-row"><div class="form-label">Incentive name</div><input class="form-input" id="target-name" value="${escapeHtml(nt.name)}" placeholder="e.g. XP Champion"></div>
    <div class="form-row"><div class="form-label">Metric</div><select class="form-select" id="target-metric">${TARGET_METRICS.map(m=>`<option value="${m.key}" ${nt.metric===m.key?'selected':''}>${m.label}</option>`).join('')}</select></div>
    <div class="form-row"><div class="form-label">Target number</div><input type="number" class="form-input" id="target-value" value="${nt.value}" placeholder="e.g. 10"></div>
    <div class="form-row"><div class="form-label">Reward</div><input class="form-input" id="target-reward" value="${escapeHtml(nt.reward)}" placeholder="e.g. Extra day off, $20 gift card, Free treatment"></div>
    <div style="display:flex; gap:8px;">
      ${state.editingTargetId ? `<button class="save-rule-btn" id="target-cancel" style="background:var(--neo-base); color:var(--ink); box-shadow:4px 4px 8px var(--neo-dark), -4px -4px 8px var(--neo-light);">Cancel</button>` : ''}
      <button class="save-rule-btn" id="target-save">${state.editingTargetId ? 'Save changes' : 'Save incentive'}</button>
    </div>
  `;
  frag.appendChild(np);
  setTimeout(() => {
    document.getElementById('target-name').oninput = e => state.newTarget.name = e.target.value;
    document.getElementById('target-metric').onchange = e => state.newTarget.metric = e.target.value;
    document.getElementById('target-value').oninput = e => state.newTarget.value = e.target.value;
    document.getElementById('target-reward').oninput = e => state.newTarget.reward = e.target.value;
    document.getElementById('target-save').onclick = saveNewTarget;
    const cancelBtn = document.getElementById('target-cancel'); if(cancelBtn) cancelBtn.onclick = cancelEditTarget;
  }, 0);
  return frag;
}

// New Targets system: manager sets one %Retail per category (reusing the
// roster's Position/Role field) and imports one Total Target $ per therapist
// — Retail/Service $ targets are derived automatically (see
// therapistGoalBreakdown). Separate from renderTargetsSub (old "Incentives").
function renderGoalsSub(){
  const frag = document.createDocumentFragment();

  const gaps = goalConfigGaps();
  if(gaps.length > 0){
    const flag = document.createElement('div'); flag.className='attn-card';
    flag.innerHTML = `<div class="attn-title">&#9888; ${gaps.length} therapist${gaps.length===1?'':'s'} not fully set up for Targets</div>
      <div class="attn-text">${gaps.map(g => `${escapeHtml(g.name)} — ${escapeHtml(g.reason)}`).join('<br>')}</div>`;
    frag.appendChild(flag);
  }

  const categories = Array.from(new Set(state.roster.map(n => therapistCategory(n)).filter(Boolean))).sort();
  const catPanel = document.createElement('div'); catPanel.className='panel';
  catPanel.innerHTML = `
    <div class="section" style="margin-top:0;">Categories &middot; %Retail</div>
    <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:12px;">One %Retail number per category — reused from each therapist's Position/Role on the roster. %Service is always whatever's left over.</div>
    ${categories.length === 0 ? `<div class="empty-state">No categories yet — import a roster with a Position/Role column, or set roles in Manager &gt; Roster.</div>` : `
      <div class="eng-list" style="margin-bottom:12px;">
        ${categories.map(cat => {
          const draftVal = state.categoryPctDraft[cat] !== undefined ? state.categoryPctDraft[cat] : (state.categoryRetailPct[cat] !== undefined ? String(state.categoryRetailPct[cat]) : '');
          const savedPct = state.categoryRetailPct[cat];
          return `<div class="pin-row">
            <div class="pin-row-name">${escapeHtml(cat)}</div>
            <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
              <input type="number" min="0" max="100" class="form-input goal-pct-input" data-cat="${escapeHtml(cat)}" value="${escapeHtml(draftVal)}" placeholder="%" style="width:60px;text-align:center;padding:7px 8px;">
              <span style="font-size:10.5px;color:var(--ink-soft);font-weight:700;">% retail</span>
              <span style="font-size:10.5px;color:var(--ink-faint);font-weight:600;min-width:78px;">${savedPct!==undefined ? `${100-savedPct}% service` : 'not set yet'}</span>
            </div>
          </div>`;
        }).join('')}
      </div>
      ${state.categoryPctMsg ? `<div class="${state.categoryPctMsg.type==='error'?'error-msg':'confirm-msg'}">${escapeHtml(state.categoryPctMsg.text)}</div>` : ''}
      <button class="muster-import-btn" id="save-categories-btn">Save categories</button>
    `}
  `;
  frag.appendChild(catPanel);
  setTimeout(() => {
    catPanel.querySelectorAll('.goal-pct-input').forEach(inp => { inp.oninput = e => { state.categoryPctDraft[inp.dataset.cat] = e.target.value; }; });
    const saveBtn = document.getElementById('save-categories-btn'); if(saveBtn) saveBtn.onclick = saveCategoryTargets;
  }, 0);

  const importPanel = document.createElement('div'); importPanel.className='panel';
  if(state.goalsImportPreview){
    const { rows } = state.goalsImportPreview;
    importPanel.innerHTML = `
      <div class="section" style="margin-top:0;">Review import &middot; ${rows.length} therapist${rows.length===1?'':'s'}</div>
      <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;">This sets each listed person's Total Target $. Anyone not in the file keeps whatever they already had.</div>
      <div class="roster-list" style="max-height:280px;overflow-y:auto;">
        ${rows.map(r => `<div class="roster-chip">${escapeHtml(r.name)}: ${r.previous!==null ? `<span style="text-decoration:line-through;color:var(--ink-faint);">${fmtMoney(r.previous)}</span> → ` : ''}<b>${fmtMoney(r.amount)}</b></div>`).join('')}
      </div>
      ${state.goalsImportMsg ? `<div class="${state.goalsImportMsg.type==='error'?'error-msg':'confirm-msg'}">${escapeHtml(state.goalsImportMsg.text)}</div>` : ''}
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button class="save-rule-btn" id="goals-import-cancel" style="background:var(--neo-base); color:var(--ink); box-shadow:4px 4px 8px var(--neo-dark), -4px -4px 8px var(--neo-light);">Cancel</button>
        <button class="save-rule-btn" id="goals-import-confirm" style="background:var(--green,#16A34A);">Confirm — save targets</button>
      </div>
    `;
    frag.appendChild(importPanel);
    setTimeout(() => {
      const c = document.getElementById('goals-import-cancel'); if(c) c.onclick = cancelGoalsImport;
      const k = document.getElementById('goals-import-confirm'); if(k) k.onclick = confirmGoalsImport;
    }, 0);
  } else {
    importPanel.innerHTML = `
      <div class="muster-drop" id="goals-drop">
        <div class="muster-drop-label">Import Total Target $</div>
        <div class="muster-drop-sub">Upload an Excel (.xlsx) or .csv file with a Name column and a Target $ column — one row per therapist. Updates just the people in the file; everyone else keeps their current target.</div>
        <input type="file" id="goals-file" accept=".csv,.xlsx,.xls" style="display:none;">
      </div>
      ${state.goalsImportMsg ? `<div class="${state.goalsImportMsg.type==='error'?'error-msg':'confirm-msg'}">${escapeHtml(state.goalsImportMsg.text)}</div>` : ''}
    `;
    frag.appendChild(importPanel);
    setTimeout(() => {
      const drop=document.getElementById('goals-drop'), fi=document.getElementById('goals-file');
      if(drop && fi){ drop.onclick=()=>fi.click(); fi.onchange=e=>{ handleGoalsFile(e.target.files[0]); fi.value=''; }; }
    }, 0);
  }

  const listPanel = document.createElement('div'); listPanel.className='panel';
  listPanel.innerHTML = `
    <div class="section" style="margin-top:0;">Current targets &middot; ${state.roster.length}</div>
    ${state.roster.length === 0 ? `<span style="color:var(--ink-soft);font-size:13px;">Add a roster first.</span>` :
      state.roster.map(n => {
        const cat = therapistCategory(n);
        const pct = categoryRetailPct(cat);
        const total = therapistTotalGoal(n);
        const breakdown = therapistGoalBreakdown(n);
        const armed = state.goalClearArmedName === n;
        const statusText = breakdown
          ? `${fmtMoney(breakdown.total)} &rarr; ${fmtMoney(breakdown.retailTarget)} retail / ${fmtMoney(breakdown.serviceTarget)} service`
          : (total === null ? 'No target imported' : (!cat ? 'No category' : `"${escapeHtml(cat)}" has no %Retail`));
        return `<div class="pin-row">
          <div class="pin-row-name">${escapeHtml(n)}${cat ? `<span class="pin-row-role"> &middot; ${escapeHtml(cat)}</span>` : ''}</div>
          <div class="pin-row-status ${breakdown?'set':'unset'}" style="${!breakdown?'color:var(--coral);background:rgba(var(--coral-rgb),0.1);':''}">${statusText}</div>
          ${total !== null ? (armed
            ? `<div class="pin-reset-confirm">Clear? <button class="goal-clear-yes" data-name="${escapeHtml(n)}">Yes</button><button class="goal-clear-no">Cancel</button></div>`
            : `<button class="pin-reset-btn" data-name="${escapeHtml(n)}">Clear</button>`) : ''}
        </div>`;
      }).join('')}
  `;
  frag.appendChild(listPanel);
  setTimeout(() => {
    listPanel.querySelectorAll('.pin-reset-btn').forEach(b => b.onclick = () => armClearGoal(b.dataset.name));
    listPanel.querySelectorAll('.goal-clear-yes').forEach(b => b.onclick = () => clearTherapistGoal(b.dataset.name));
    listPanel.querySelectorAll('.goal-clear-no').forEach(b => b.onclick = cancelClearGoal);
  }, 0);

  return frag;
}

function renderEngagementSub(){
  const frag = document.createDocumentFragment();
  const totalOpens = state.hubClicks.length;
  const engagedNames = new Set(state.hubClicks.map(c => c.name));
  const pct = state.roster.length ? Math.round((engagedNames.size / state.roster.length) * 100) : 0;

  const sum = document.createElement('div'); sum.className='eng-summary';
  sum.innerHTML = `<div class="eng-tile"><div class="eng-tile-n">${totalOpens}</div><div class="eng-tile-l">Opens</div></div><div class="eng-tile"><div class="eng-tile-n">${pct}%</div><div class="eng-tile-l">Of crew</div></div>`;
  frag.appendChild(sum);

  const sec = document.createElement('div'); sec.className='section'; sec.textContent='By crew member'; frag.appendChild(sec);
  const list = document.createElement('div'); list.className='eng-list';
  list.innerHTML = state.roster.map(name => {
    const clicks = state.hubClicks.filter(c => c.name === name);
    const lessons = Array.from(new Set(clicks.map(c => c.lesson)));
    const on = clicks.length > 0;
    return `<div class="eng-row"><div class="eng-name"><span class="eng-dot ${on?'on':'off'}"></span>${escapeHtml(name)}</div>
      <div class="eng-lessons">${on ? 'Opened: '+escapeHtml(lessons.join(', ')) : "Hasn't opened the hub yet"}</div></div>`;
  }).join('');
  frag.appendChild(list);

  const resetPanel = document.createElement('div'); resetPanel.className='panel danger-card';
  resetPanel.innerHTML = `
    <div class="section" style="margin-top:0;">Danger zone</div>
    <div class="danger-card-title">Reset hub tracker</div>
    <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:12px;">Clears the "who opened what" log above — Opens, % of crew, and everyone's opened-lesson history all go back to zero. The lessons themselves aren't touched, and nothing else in the app is affected.</div>
    ${state.hubEngMsg ? `<div class="${state.hubEngMsg.type==='error'?'error-msg':'confirm-msg'}">${escapeHtml(state.hubEngMsg.text)}</div>` : ''}
    ${state.hubResetArmed ? `
      <div class="error-msg" role="alert">This can't be undone. Permanently clear all ${totalOpens} logged open${totalOpens===1?'':'s'}?</div>
      <div style="display:flex; gap:8px;">
        <button class="save-rule-btn" id="hub-reset-cancel" style="background:var(--neo-base); color:var(--ink); box-shadow:4px 4px 8px var(--neo-dark), -4px -4px 8px var(--neo-light);">Cancel</button>
        <button class="save-rule-btn" id="hub-reset-confirm" style="background:var(--coral);">Yes, clear tracker</button>
      </div>
    ` : `<button class="save-rule-btn" id="hub-reset-start" style="background:var(--coral);" ${totalOpens===0?'disabled':''}>Reset hub tracker</button>`}
  `;
  frag.appendChild(resetPanel);
  setTimeout(() => {
    const startBtn = document.getElementById('hub-reset-start'); if(startBtn) startBtn.onclick = armHubReset;
    const cancelBtn = document.getElementById('hub-reset-cancel'); if(cancelBtn) cancelBtn.onclick = cancelHubReset;
    const confirmBtn = document.getElementById('hub-reset-confirm'); if(confirmBtn) confirmBtn.onclick = resetHubTracker;
  }, 0);

  return frag;
}

function initParticles(){
  const field = document.getElementById('particle-field');
  if(!field) return;
  const colors = ['rgba(var(--green-rgb),0.6)','rgba(var(--blue-rgb),0.55)'];
  let html = '';
  for(let i=0;i<24;i++){
    const left = Math.random()*100, top = Math.random()*100;
    const size = 1.5 + Math.random()*2.5;
    const color = colors[i % 2];
    const dur = (3 + Math.random()*4).toFixed(1);
    const delay = (Math.random()*5).toFixed(1);
    html += `<div class="particle" style="left:${left}%; top:${top}%; width:${size}px; height:${size}px; background:${color}; animation-duration:${dur}s; animation-delay:${delay}s;"></div>`;
  }
  field.innerHTML = html;
}
initParticles();
restoreSession();
loadData();
startLiveEntries();
// Registered once for the page's whole lifetime (rather than inside each
// render function, which would otherwise stack up a fresh listener every
// time) — closes any open name-search dropdown (the login screen's, or one
// of the Medi Spa/Acupuncture XP breakdown rows') on a click outside its
// own combo. Checked per-dropdown so picking a name in one row doesn't
// leave a stale dropdown open in another.
document.addEventListener('click', (e) => {
  document.querySelectorAll('.name-dropdown.open').forEach(dropdown => {
    const combo = dropdown.closest('.name-combo');
    if(!combo || !combo.contains(e.target)) dropdown.classList.remove('open');
  });
});
</script>
